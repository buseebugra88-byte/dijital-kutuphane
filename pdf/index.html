<!doctype html>
<html lang="tr" class="app-pdf"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PDF Atölyem</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png?v=3"><link rel="apple-touch-icon" href="icon-180.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PDF Atölyem"><meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="style.css?v=1">

<link rel="stylesheet" href="../ortak/tema.css?v=1"></head><body>
<div id="app"></div>
<noscript>PDF Atölyem için JavaScript gerekli.</noscript>
<script src="core.js?v=1"></script>
<script src="viewer.js?v=1"></script>
<script src="textedit.js?v=1"></script>
<script src="tools.js?v=1"></script>
<script src="library.js?v=1"></script>
<script src="convert.js?v=1"></script>
<script src="tools2.js?v=1"></script>
<script>
'use strict';
// Yönlendirme: #/ ana ekran · #/oku/<id> okuyucu · #/arac/<ad>?doc=<id> araç
async function route(){clearBar();$$('.modalbg,.menu-pop,.searchbox').forEach(e=>e.remove());if(V.st)V.close();window.scrollTo(0,0);
  const h=location.hash.replace(/^#\/?/,'');const[path]=h.split('?');const[a,b]=path.split('/');
  try{
    if(a==='oku'&&b){await V.open(b);const t=sessionStorage.getItem('pdfTool');if(t&&V.st){sessionStorage.removeItem('pdfTool');V.setTool(t);if(t==='text')toast('Metin eklemek için sayfada bir yere tıkla')}}
    else if(a==='kutuphane'&&b){$('#app').innerHTML='';await Lib.openBook(decodeURIComponent(b))}
    else if(a==='arac'&&b){const t=toolById(b);if(!t||t.soon){location.hash='#/';return}await RUN[t.id](t)}
    else await renderHome();
  }catch(e){console.error(e);alertBox('Bir sorun oluştu',esc(errText(e)))}}
window.addEventListener('hashchange',route);
// Dosyayı sayfanın herhangi bir yerine bırakınca aç
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{if(e.defaultPrevented)return;e.preventDefault();const fs=[...e.dataTransfer.files].filter(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf');if(fs.length&&!location.hash.includes('arac'))importFiles(fs)});
// "Birlikte aç" (destekleyen tarayıcılarda PDF'ler doğrudan bu uygulamayla açılır)
if('launchQueue' in window)launchQueue.setConsumer(async p=>{const fs=await Promise.all((p.files||[]).map(h=>h.getFile()));if(fs.length)importFiles(fs)});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});
route();
</script>
</body></html>
