/* ---------- typewriter ---------- */
// Each struck letter gets its own ink weight and a hair of baseline drift, like a worn ribbon.
function typeChar(ch,seed,i,ov){
  if(ch==="\n")return ch;if(ch===" "||ch==="\t")return ov?`<span class="ov"> </span>`:ch;
  const h=hashStr(seed+":"+i+ch);const a=(h&255)/255,b=((h>>8)&255)/255,c=((h>>16)&255)/255;
  let op=.68+a*.32; if(c>.93)op=.45; // faint strike now and then
  const dy=((b-.5)*1.3).toFixed(2), dx=c<.06?.6:0;
  return `<span${ov?' class="ov"':""} style="opacity:${op.toFixed(2)};top:${dy}px${dx?";left:"+dx+"px":""}">${esc(ch)}</span>`}
// ~~words~~ are struck over with x's. In the live mirror the markers keep their width (invisible) so the caret stays aligned.
function typePieces(text,seed,mirror){const s=String(text||""),out=[];let ov=false;
  for(let i=0;i<s.length;i++){if(s[i]==="~"&&s[i+1]==="~"){out.push(mirror?'<span class="mk">~~</span>':"");ov=!ov;i++;continue}
    if(s[i]==="\n")ov=false;out.push(typeChar(s[i],seed,i,ov))}return out}
function typeHTML(text,seed,mirror){return typePieces(text,seed,mirror).join("")}
function inkHTML(body){return esc(body).replace(/~~([^~\n]+?)~~/g,'<span class="scr">$1</span>')}

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==="suspended")AC.resume();return AC}
function noise(ctx,dur){const b=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=b;return s}
function sndKey(soft){if(!twSound)return;const ctx=ac();if(!ctx)return;const t=ctx.currentTime;
  const n=noise(ctx,.05),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type="bandpass";f.frequency.value=1800+Math.random()*1400;f.Q.value=.9;
  g.gain.setValueAtTime((soft?.18:.32)*(0.8+Math.random()*.4),t);g.gain.exponentialRampToValueAtTime(.001,t+.045);n.connect(f).connect(g).connect(ctx.destination);n.start(t);n.stop(t+.05);
  const o=ctx.createOscillator(),og=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(60,t+.04);
  og.gain.setValueAtTime(soft?.08:.16,t);og.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(og).connect(ctx.destination);o.start(t);o.stop(t+.06)}
function sndReturn(){if(!twSound)return;const ctx=ac();if(!ctx)return;const t=ctx.currentTime;
  for(let k=0;k<7;k++){const n=noise(ctx,.02),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type="highpass";f.frequency.value=2200;
    const s=t+k*.03;g.gain.setValueAtTime(.12,s);g.gain.exponentialRampToValueAtTime(.001,s+.02);n.connect(f).connect(g).connect(ctx.destination);n.start(s);n.stop(s+.025)}
  const n=noise(ctx,.08),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type="lowpass";f.frequency.value=700;const s=t+.22;
  g.gain.setValueAtTime(.4,s);g.gain.exponentialRampToValueAtTime(.001,s+.08);n.connect(f).connect(g).connect(ctx.destination);n.start(s);n.stop(s+.09)}
function sndDing(){if(!twSound)return;const ctx=ac();if(!ctx)return;const t=ctx.currentTime;
  [[2093,.16],[4186,.05],[6280,.02]].forEach(([fr,v])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=fr;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+1.4);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+1.5)})}

  else{letters=letters.filter(x=>x.id!==l.id);letters.push(l);sortL();lsSet(LS,letters)}
}
async function patchLetter(id,p){const l=letters.find(x=>x.id===id);if(!l)return;p={...p,upd:Date.now()};Object.assign(l,p);
  if(mode==="db"){try{await dbCol.doc(id).update(p)}catch(e){}}else lsSet(LS,letters)}
async function removeLetter(id){mkTomb(id);
  if(mode==="db"){try{await dbCol.doc(id).delete()}catch(e){toast("Silinemedi, tekrar dene.");return}}
  letters=letters.filter(x=>x.id!==id);if(mode!=="db")lsSet(LS,letters)}
async function initDb(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;const uid=await user.id();if(!uid)return;
    dbCol=db.collection("data/users/"+uid);mode="db";
    const local=lsGet(LS,[]);
    for(const l of local){try{await dbCol.doc(l.id).set(l)}catch(e){}}
    if(local.length)lsSet(LS,[]);
    dbCol.onSnapshot(s=>{letters=s.docs.map(d=>({...d.data()}));sortL();updateCount();if(view==="kutu")render();
        document.getElementById("status").textContent="Mektupların hesabında saklanıyor; başka cihazdan açınca da kutunda olur."},
      ()=>{mode="local";});
  }catch(e){}
}

function fitCanvas(im,max){const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c}
// Flood from the photo's edges and clear everything close to the edge colour, so a dried flower shot on plain paper becomes a sticker.
function cutBackground(src,tol){const c=document.createElement("canvas");c.width=src.width;c.height=src.height;const x=c.getContext("2d");x.drawImage(src,0,0);
  const W=c.width,H=c.height,img=x.getImageData(0,0,W,H),d=img.data;let r=0,g=0,b=0,n=0;
  const edge=[];for(let i=0;i<W;i++){edge.push(i,(H-1)*W+i)}for(let j=0;j<H;j++){edge.push(j*W,j*W+W-1)}
  for(const p of edge){r+=d[p*4];g+=d[p*4+1];b+=d[p*4+2];n++}r/=n;g/=n;b/=n;
  const T=tol*tol,bg=new Uint8Array(W*H),q=new Int32Array(W*H);let h=0,t=0;
  const near=p=>{const dr=d[p*4]-r,dg=d[p*4+1]-g,db=d[p*4+2]-b;return dr*dr+dg*dg+db*db<T};
  for(const p of edge)if(!bg[p]&&near(p)){bg[p]=1;q[t++]=p}
  while(h<t){const p=q[h++],px=p%W,py=(p-px)/W;
    for(const np of [px>0?p-1:-1,px<W-1?p+1:-1,py>0?p-W:-1,py<H-1?p+W:-1])if(np>=0&&!bg[np]&&near(np)){bg[np]=1;q[t++]=np}}
  let x0=W,y0=H,x1=-1,y1=-1;
  for(let p=0;p<W*H;p++){if(bg[p]){d[p*4+3]=0;continue}const px=p%W,py=(p-px)/W;
    if((px>0&&bg[p-1])||(px<W-1&&bg[p+1])||(py>0&&bg[p-W])||(py<H-1&&bg[p+W]))d[p*4+3]=150;
    if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}
  x.putImageData(img,0,0);if(x1<0)return c;
  const o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;o.getContext("2d").drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o}

function bindKb(ta){const kb=document.getElementById("kb");if(!kb)return;
  const fire=t=>ta.dispatchEvent(new InputEvent("input",{inputType:t,bubbles:true}));
  kb.addEventListener("pointerdown",e=>{const b=e.target.closest("[data-kk]");if(!b)return;e.preventDefault();
    if(document.activeElement!==ta){ta.focus({preventScroll:true});if(ta.selectionStart===0&&ta.value)ta.setSelectionRange(ta.value.length,ta.value.length)}
    b.classList.add("dn");setTimeout(()=>b.classList.remove("dn"),90);
    const k=b.dataset.kk,a=ta.selectionStart,z=ta.selectionEnd;
    if(k==="SH"){kbShift=!kbShift;kb.querySelectorAll("[data-kk]").forEach(x=>{const v=x.dataset.kk;if(v.length===1)x.textContent=kbShift?v.toLocaleUpperCase("tr-TR"):v});b.classList.toggle("on",kbShift);sndKey(true);return}
    if(k==="BS"){if(a===z&&a>0)ta.setRangeText("",a-1,a,"end");else ta.setRangeText("",a,z,"end");fire("deleteContentBackward");return}
    if(k==="RET"){ta.setRangeText("\n",a,z,"end");fire("insertLineBreak");return}
    let ch=k==="SP"?" ":k;if(kbShift&&ch.length===1){ch=ch.toLocaleUpperCase("tr-TR");kbShift=false;kb.querySelectorAll("[data-kk]").forEach(x=>{const v=x.dataset.kk;if(v.length===1)x.textContent=v});kb.querySelector('[data-kk="SH"]').classList.remove("on")}
    ta.setRangeText(ch,a,z,"end");fire("insertText");
    const r=ta.getBoundingClientRect(),kr=kb.getBoundingClientRect();if(r.bottom>kr.top){/* keep the line being typed above the keyboard */}
  })}
/* ---------- desk ambience, synthesised (no audio files) ---------- */
const AMBN={yok:"Sessiz",yagmur:"Yağmur",somine:"Şömine",plak:"Plak",kafe:"Kafe"};
const AMB={k:"yok",nodes:[],timers:[],out:null};
function ambLoop(ctx,kind,sec){const b=ctx.createBuffer(1,ctx.sampleRate*sec,ctx.sampleRate),d=b.getChannelData(0);let last=0;
  for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(kind==="brown"){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}
  const s=ctx.createBufferSource();s.buffer=b;s.loop=true;return s}
function ambStop(){AMB.timers.forEach(clearTimeout);AMB.timers=[];AMB.nodes.forEach(n=>{try{n.stop&&n.stop()}catch(e){}try{n.disconnect()}catch(e){}});AMB.nodes=[];}
function ambPlay(k){ambStop();AMB.k=k;try{localStorage.setItem("muhurlu-ortam",k)}catch(e){}if(k==="yok")return;const ctx=ac();if(!ctx)return;
  const out=ctx.createGain();out.gain.value=.55;out.connect(ctx.destination);AMB.nodes.push(out);
  const chain=(src,...fx)=>{let n=src;for(const f of fx){n.connect(f);n=f;AMB.nodes.push(f)}n.connect(out);AMB.nodes.push(src);src.start();return n};
  const flt=(type,f,q)=>{const x=ctx.createBiquadFilter();x.type=type;x.frequency.value=f;if(q)x.Q.value=q;return x};
  const gain=v=>{const g=ctx.createGain();g.gain.value=v;return g};
  const burst=(dur,v,type,f)=>{const t=ctx.currentTime,n=ambLoop(ctx,"white",.05),g=ctx.createGain(),fl=flt(type,f);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);n.connect(fl).connect(g).connect(out);n.start(t);n.stop(t+dur+.02)};
  const every=(min,max,fn)=>{const go=()=>{if(AMB.k!==k)return;fn();AMB.timers.push(setTimeout(go,min+Math.random()*(max-min)))};AMB.timers.push(setTimeout(go,min))};
  if(k==="yagmur"){chain(ambLoop(ctx,"white",3),flt("lowpass",2600),flt("highpass",380),gain(.22));chain(ambLoop(ctx,"brown",3),flt("lowpass",420),gain(.35));
    every(25,110,()=>burst(.03+Math.random()*.04,.05+Math.random()*.08,"bandpass",1800+Math.random()*3000))}
  if(k==="somine"){chain(ambLoop(ctx,"brown",4),flt("lowpass",520),gain(.75));
    every(60,420,()=>{const n=Math.random()<.3?3:1;for(let i=0;i<n;i++)setTimeout(()=>burst(.012+Math.random()*.03,.12+Math.random()*.3,"highpass",1200+Math.random()*2500),i*30)})}
  if(k==="plak"){chain(ambLoop(ctx,"white",2),flt("highpass",3200),gain(.035));chain(ambLoop(ctx,"brown",3),flt("lowpass",160),gain(.25));
    every(90,700,()=>burst(.004+Math.random()*.008,.15+Math.random()*.35,"highpass",900));every(1800,1800,()=>burst(.02,.05,"lowpass",300))}
  if(k==="kafe"){const src=ambLoop(ctx,"white",4),bp=flt("bandpass",520,.7),g=gain(.22),lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.23;lg.gain.value=.08;lfo.connect(lg).connect(g.gain);lfo.start();AMB.nodes.push(lfo,lg);chain(src,bp,flt("lowpass",1400),g);
    every(2500,7000,()=>{const t=ctx.currentTime,o=ctx.createOscillator(),og=ctx.createGain();o.frequency.value=2600+Math.random()*1800;og.gain.setValueAtTime(.05,t);og.gain.exponentialRampToValueAtTime(.0005,t+.5);o.connect(og).connect(out);o.start(t);o.stop(t+.55)})}
}
(function(){let saved="yok";try{saved=localStorage.getItem("muhurlu-ortam")||"yok"}catch(e){}if(saved==="yok")return;AMB.k=saved;
  const once=()=>{removeEventListener("pointerdown",once,true);if(AMB.k===saved)ambPlay(saved)};addEventListener("pointerdown",once,true)})();

  const cv=host.querySelector("canvas"),x=cv.getContext("2d");x.lineCap=x.lineJoin="round";x.strokeStyle="#fff";x.lineWidth=11;let on=false,drawn=false;

/* Drip the wax by holding, then press the brass stamp. Resolves true when done, false if skipped. */
function waxBlob(seed){const r=rng(seed),n=12,P=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,R=40+r()*8;P.push([Math.cos(a)*R,Math.sin(a)*R])}
  const m=i=>{const p=P[i%n],q=P[(i+1)%n];return [(p[0]+q[0])/2,(p[1]+q[1])/2]};let d=`M${m(0)[0].toFixed(1)} ${m(0)[1].toFixed(1)}`;
  for(let i=1;i<=n;i++){const c=P[i%n],e=m(i);d+=` Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${e[0].toFixed(1)} ${e[1].toFixed(1)}`}return d+"Z"}
function waxCeremony(eb,seal){return new Promise(done=>{
  const c1=SEALS[draft.seal]||SEALS.bordo,c2=SEALS[draft.seal2];
  const wax=document.createElement("div");wax.className="wax";
  const drops=[...Array(6)].map((_,i)=>{const r=rng(draft.seed+i);return `<circle cx="${(r()*50-25).toFixed(1)}" cy="${(r()*50-25).toFixed(1)}" r="${(5+r()*7).toFixed(1)}" fill="${c2||c1}" opacity="${c2?.9:.0}"/>`}).join("");
  wax.innerHTML=`<svg viewBox="-50 -50 100 100"><g class="pud"><path d="${waxBlob(draft.seed)}" fill="${c1}"/>${drops}<ellipse cx="-14" cy="-18" rx="12" ry="5" fill="rgba(255,255,255,.25)" transform="rotate(-30 -14 -18)"/></g></svg>`;
  const stp=document.createElement("div");stp.className="stampr";stp.innerHTML=`<svg viewBox="0 0 60 130" aria-hidden="true"><defs><linearGradient id="brs" x1="0" x2="1"><stop offset="0" stop-color="#8a6a2a"/><stop offset=".45" stop-color="#e8c977"/><stop offset="1" stop-color="#7a5a20"/></linearGradient><linearGradient id="wd" x1="0" x2="1"><stop offset="0" stop-color="#5a3520"/><stop offset=".5" stop-color="#a0683e"/><stop offset="1" stop-color="#4a2a18"/></linearGradient></defs>
   <ellipse cx="30" cy="20" rx="17" ry="19" fill="url(#wd)"/><path d="M22 36 C24 50 24 62 20 76 L40 76 C36 62 36 50 38 36Z" fill="url(#wd)"/><rect x="14" y="76" width="32" height="8" rx="2" fill="url(#brs)"/><path d="M18 84 L42 84 L46 124 L14 124Z" fill="url(#brs)"/><rect x="12" y="122" width="36" height="6" rx="2" fill="#6b4f1c"/></svg>`;
  eb.append(wax,stp);
  const cer=document.createElement("div");cer.className="cer";cer.innerHTML=`<p id="cer-t">Mumu damlatmak için <b>basılı tut</b>.</p>
   <div class="row" style="justify-content:center;gap:10px"><button class="btn" id="cer-drip">🕯️ Basılı tut</button><button class="btn" id="cer-press" hidden>Mührü bastır</button></div>
   <button class="link" id="cer-skip">Hızlı mühürle</button>`;
  eb.parentElement.after(cer);cer.scrollIntoView({block:"nearest",behavior:"smooth"});
  const pud=wax.querySelector(".pud");let amt=0,raf=0,last=0,holding=false;
  const tick=t=>{if(!holding)return;if(last)amt=Math.min(1,amt+(t-last)/1500);last=t;pud.style.transform=`scale(${(.15+amt*.85).toFixed(3)})`;
    if(amt>=.55){document.getElementById("cer-press").hidden=false;document.getElementById("cer-t").innerHTML=amt>=1?"Mum hazır. Şimdi mührü bastır.":"Güzel! İstersen biraz daha damlat ya da mührü bastır."}
    if(amt<1)raf=requestAnimationFrame(tick);else holding=false};
  const start=e=>{e.preventDefault();if(holding)return;holding=true;last=0;wax.classList.add("on");raf=requestAnimationFrame(tick)};
  const stop=()=>{holding=false;cancelAnimationFrame(raf)};
  const dripB=document.getElementById("cer-drip");
  [dripB,eb].forEach(el=>{el.addEventListener("pointerdown",start);el.addEventListener("pointerup",stop);el.addEventListener("pointerleave",stop);el.addEventListener("pointercancel",stop)});
  dripB.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){amt=Math.min(1,amt+.2);holding=true;last=0;tick(performance.now());holding=false;pud.style.transform=`scale(${(.15+amt*.85).toFixed(3)})`}});
  const cleanup=()=>{stop();[dripB,eb].forEach(el=>{el.removeEventListener("pointerdown",start)});cer.remove()};
  document.getElementById("cer-skip").addEventListener("click",()=>{wax.remove();stp.remove();cleanup();done(false)});
  document.getElementById("cer-press").addEventListener("click",async()=>{stop();cleanup();
    const w=ms=>new Promise(r=>setTimeout(r,ms));
    stp.classList.add("down");await w(380);sndKey();
    seal.style.opacity="";seal.style.transition="none";seal.style.transform=`translate(-50%,-50%) scale(${(.85+amt*.2).toFixed(2)})`;wax.remove();
    await w(260);stp.classList.add("up");await w(500);stp.remove();seal.style.transition="";done(true)});
})}
async function sealIt(){
  if(draft.lock&&(!draft.openAfter||daysUntil(draft.openAfter)<1)){toast("Açılış tarihi olarak ileri bir gün seç.");return}
  const btn=document.getElementById("b-seal");btn.disabled=true;
  const eb=document.getElementById("eb");const sheet=eb.querySelector(".sheet");const seal=eb.querySelector(".seal");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;const w=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
  eb.scrollIntoView({block:"center",behavior:reduce?"auto":"smooth"});
  await w(250);sheet.classList.remove("out");await w(950);eb.classList.remove("open");await w(700);

  document.getElementById("b-del").addEventListener("click",()=>{const r=document.getElementById("delrow");
    r.innerHTML=`<div class="confirm"><span>Bu mektup kalıcı olarak silinsin mi?</span><button class="btn ghost" id="c-no">Vazgeç</button><button class="btn danger" id="c-yes">Sil</button></div>`;
    document.getElementById("c-no").addEventListener("click",renderOku);
    document.getElementById("c-yes").addEventListener("click",async()=>{await removeLetter(l.id);updateCount();toast("Mektup silindi.");reading=null;go("kutu")})});
  bindActs(l);
  const ics=document.getElementById("b-ics");if(ics)ics.addEventListener("click",()=>addToCalendar(l));
  const fl=document.getElementById("b-flip");if(fl)fl.addEventListener("click",()=>{const kf=document.getElementById("kf");const back=!kf.dataset.back;
    kf.classList.add("turn");setTimeout(()=>{kf.innerHTML=back?paperRead(l):kartFrontHTML(l);kf.dataset.back=back?"1":"";fl.textContent=back?"↻ Ön yüzü göster":"↻ Arkasını çevir";kf.classList.remove("turn");kf.classList.add("turn2");setTimeout(()=>kf.classList.remove("turn2"),260);
      document.getElementById("acts").innerHTML=back?actsHTML(l):"";if(back)bindActs(l)},240)});
  app.querySelectorAll("[data-th]").forEach(b=>b.addEventListener("click",()=>{reading=b.dataset.th;go("oku")}));
  const br=document.getElementById("b-break");
  if(br)br.addEventListener("click",async()=>{
    br.remove();const rb=document.getElementById("rb");const seal=rb.querySelector(".seal");
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;const w=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
    seal.classList.add("crack");await w(450);rb.classList.add("open");await w(700);rb.querySelector(".sheet").classList.add("out");await w(800);
    const tw=l.hand==="daktilo"&&!reduce&&l.body;
    document.getElementById("letterout").outerHTML=tw?sheetHTML(l,readInner(l,true)):paperRead(l);document.querySelector(".read .hint")?.remove();
    patchLetter(l.id,{opened:true});
    document.getElementById("acts").innerHTML=actsHTML(l);bindActs(l);
    if(tw)typeOut(l);
  });
}

// The letter is struck out on the page as it's read; a tap shows the rest at once.
function typeOut(l){
  const el=document.querySelector(".read .body.typed");if(!el)return;
  const s=l.body,seed=l.seed||l.id;const total=Math.min(7000,s.length*38),step=Math.max(1,Math.ceil(s.length/(total/40)));
  const skip=document.createElement("button");skip.className="link skip";skip.textContent="Hepsini göster";
  el.closest(".sheetwrap").after(skip);
  const P=typePieces(s,seed,false);let i=0,html="",done=false,last=0;
  const finish=()=>{if(done)return;done=true;clearInterval(t);el.innerHTML=P.join("");skip.remove()};
  skip.addEventListener("click",finish);
  const t=setInterval(()=>{if(!document.body.contains(el)){clearInterval(t);return}
    const end=Math.min(P.length,i+step);let nl=false;
    for(;i<end;i++){html+=P[i];if(P[i]==="\n")nl=true}
    el.innerHTML=html;const now=Date.now();
    if(nl)sndReturn();else if(now-last>70){sndKey(true);last=now}
    if(i>=P.length)finish()},40);
}
