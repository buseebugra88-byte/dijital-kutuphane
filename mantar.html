<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mantar Bekçisi</title>
<meta name="theme-color" content="#3f6b4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mantar Bekçisi">
<link rel="manifest" href="mantar.webmanifest">
<link rel="icon" href="mantar-192.png">
<link rel="apple-touch-icon" href="mantar-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* Layout: tek sütun, büyük yazı; altta 4 büyük sekme; her ekran tek iş yapar */
:root{
  --bg:#f6f1e7;
  --card:#fffdf8;
  --ink:#2b2620;
  --muted:#6b6257;
  --line:#e0d5c2;
  --forest:#3f6b4a;
  --forest-soft:#e3ecdf;
  --danger:#b3261e;
  --danger-soft:#fbe4e1;
  --warn:#8a5a00;
  --warn-soft:#fff1cf;
  --body:"Atkinson Hyperlegible",system-ui,"Segoe UI",Roboto,sans-serif;
  --display:"Fraunces",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--forest);outline-offset:3px}
.wrap{max-width:620px;margin:0 auto;display:grid;gap:18px;padding-block:18px 10px}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:26px}h3{font-size:20px;margin:0}
p{margin:0}
.top{display:flex;align-items:center;gap:12px}
.top img{width:52px;height:52px;border-radius:14px}
.top small{display:block;color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px}
.rule{background:var(--forest);color:#fff;border-radius:20px;padding:18px;display:grid;gap:6px}
.rule b{font-size:22px;font-family:var(--display)}
.big{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:0;border-radius:22px;padding:20px;min-height:96px;font-size:22px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.big span.i{font-size:38px;line-height:1;flex:none}
.big small{display:block;font-size:16px;font-weight:400;opacity:.9;margin-top:2px}
.b-photo{background:#e7efe3;color:#22402b;border:2px solid #b9cdb2}
.b-check{background:#fff7e3;color:#5a3d00;border:2px solid #ead7a3}
.b-sos{background:var(--danger);color:#fff}
.b-guide{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 18px;font-size:19px;font-weight:700;min-height:56px}
.btn.pri{background:var(--forest);border-color:var(--forest);color:#fff}
.btn.red{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 160px}
.muted{color:var(--muted)}
.ate{display:grid;gap:10px}
.ate .t{font-size:24px;font-weight:700}

/* alt menü */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav button{border:0;background:none;border-radius:14px;padding:6px 2px;display:grid;justify-items:center;gap:2px;font-size:13.5px;font-weight:700;color:var(--muted)}
nav button span{font-size:26px;line-height:1.1}
nav button[aria-current="page"]{background:var(--forest-soft);color:var(--forest)}
nav button.sos{color:var(--danger)}
nav button.sos[aria-current="page"]{background:var(--danger-soft)}

/* fotoğraf */
.shots{display:grid;gap:12px}
.shot{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px}
.shot.done{border-color:#b9cdb2;background:#f4f8f1}
.shot .ph{width:96px;height:96px;border-radius:12px;background:#efe7d8 center/cover no-repeat;display:grid;place-items:center;font-size:36px}
.shot b{display:block;font-size:20px}
.shot p{font-size:16px;color:var(--muted);line-height:1.35;margin-top:2px}
.shot label{display:inline-block;margin-top:8px;background:var(--forest);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:17px;cursor:pointer}
.shot.done label{background:var(--card);color:var(--forest);border:2px solid #b9cdb2}
.shot input{position:absolute;width:1px;height:1px;opacity:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:17px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:#fff}
textarea{width:100%;border:2px solid var(--line);border-radius:14px;background:#fff;padding:12px;font-size:18px;min-height:84px}
.rec{display:grid;gap:10px}
.rec .th{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rec .th i{aspect-ratio:1;border-radius:10px;background:#efe7d8 center/cover no-repeat}
.tag{display:inline-block;border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
.tag.red{background:var(--danger-soft);color:var(--danger)}.tag.amber{background:var(--warn-soft);color:var(--warn)}.tag.none{background:#eee6d8;color:var(--muted)}

/* kontrol */
.prog{height:10px;background:#eadfcc;border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--forest)}
.q{font-size:25px;font-family:var(--display);font-weight:700;line-height:1.25}
.qhint{background:#f1ead9;border-radius:14px;padding:12px 14px;font-size:17px;color:#4b4339}
.ans{display:grid;gap:12px}
.ans button{border-radius:20px;padding:20px;font-size:24px;font-weight:700;min-height:76px;border:3px solid}
.a-yes{background:#fff;border-color:var(--danger)!important;color:var(--danger)}
.a-no{background:#fff;border-color:var(--forest)!important;color:var(--forest)}
.a-unsure{background:#fff;border-color:#c9a14a!important;color:var(--warn)}
.stop{background:var(--danger);color:#fff;border-radius:24px;padding:24px;display:grid;gap:12px;text-align:center}
.stop .x{font-size:64px;line-height:1}
.stop h2{font-size:42px;color:#fff}
.stop p{font-size:20px}
.caution{background:var(--warn-soft);border:3px solid #e2c06e;border-radius:24px;padding:22px;display:grid;gap:12px}
.caution h2{color:#6b4500}
ul.steps{margin:0;padding-left:22px;display:grid;gap:8px}

/* acil */
.call{display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;border-radius:22px;padding:20px;font-size:28px;font-weight:700;min-height:88px}
.call.c112{background:var(--danger);color:#fff}
.call.c114{background:#fff;color:var(--danger);border:3px solid var(--danger)}
.call small{display:block;font-size:16px;font-weight:400}
.tl{display:grid;gap:10px}
.tl div{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:start}
.tl b{background:#f1ead9;border-radius:10px;padding:4px 8px;text-align:center;font-size:16px}
.tl div.hot b{background:var(--danger);color:#fff}

/* rehber */
.pair{display:grid;gap:12px}
.pair .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair figure{margin:0;border-radius:16px;padding:10px;display:grid;gap:6px;justify-items:center;text-align:center}
.pair figure.ok{background:#eef3ea}.pair figure.bad{background:var(--danger-soft)}
.pair figure svg{width:100%;max-width:150px;height:auto}
.pair figcaption{font-size:16px;line-height:1.3}
.pair figcaption b{display:block;font-size:17px}
.pair figure.bad figcaption b{color:var(--danger)}
.diff{display:grid;gap:6px;font-size:17px}
.diff div{display:grid;grid-template-columns:28px 1fr;gap:6px}
.never{display:grid;gap:12px}
.myth{display:grid;gap:4px;border-bottom:1px solid var(--line);padding-bottom:10px}
.myth s{color:var(--danger);text-decoration-thickness:2px}
a{color:var(--forest);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#2b2620;color:#fff;border-radius:16px;padding:12px 18px;font-size:17px;max-width:calc(100% - 32px);text-align:center}
.wrap{zoom:var(--z,1)}
.say{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:24px;display:grid;place-items:center;padding:0}
.rule .say{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4)}.stop .say{justify-self:center;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.5)}
.az{min-height:52px;padding:8px 14px;font-size:20px}
.b-spot{background:#eaf1f7;color:#1f3d5a;border:2px solid #bdd0e2}
.season{border-color:#e6d2a8;background:#fffaf0}.warnline{color:#7a3b00}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#ece3d2;border-radius:16px;padding:5px}
.seg button{border:0;background:transparent;border-radius:12px;padding:12px 6px;font-size:18px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--forest);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button.card{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.spot .dist{font-size:22px;font-weight:700;color:#1f3d5a}.dirw{font-size:19px;font-weight:700;color:var(--forest)}
.big2{font-size:38px;font-weight:700;color:#1f3d5a;line-height:1.1}
.radar svg{width:100%;max-width:320px;justify-self:center;height:auto}
.legend{margin:0;padding-left:24px;font-size:17px;display:grid;gap:2px}
.yr{display:grid;gap:10px}.yr h3 .muted{font-size:16px;font-weight:400}
.card input:not([type=file]){width:100%;border:2px solid var(--line);border-radius:14px;background:#fff;padding:12px;font-size:18px}
.linkbtn{display:block;text-align:center;text-decoration:none;color:var(--ink)}
.tag.ok{background:var(--forest-soft);color:var(--forest)}
.intro{min-height:calc(100vh - 60px);display:grid;align-content:center;gap:18px;text-align:center;justify-items:center}
.intro .ib{font-size:84px;line-height:1}.intro p{font-size:21px;max-width:30ch}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:#d8ccb6}.dots i.on{background:var(--forest)}
@media (max-width:380px){body{font-size:18px}.big{font-size:20px}.pair .two{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<nav aria-label="Bölümler" id="nav">
  <button type="button" data-go="home"><span>🏠</span>Ana</button>
  <button type="button" data-go="book"><span>📒</span>Defter</button>
  <button type="button" data-go="check"><span>✅</span>Kontrol</button>
  <button type="button" data-go="guide"><span>📖</span>Rehber</button>
  <button type="button" data-go="sos" class="sos"><span>🚨</span>Acil</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem('mb-'+k));if(v===null)localStorage.removeItem('mb-'+k);else localStorage.setItem('mb-'+k,JSON.stringify(v))}catch(e){return null}};
let toastT;function toast(t,ms){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,ms||2600)}
const ASK=store('ask')||'Buse';

/* ---------- kayıtlar (IndexedDB) ---------- */
const DB={db:null,open(){return new Promise((ok,no)=>{const r=indexedDB.open('mantar-bekcisi',1);r.onupgradeneeded=()=>r.result.createObjectStore('recs',{keyPath:'id'});r.onsuccess=()=>{DB.db=r.result;ok()};r.onerror=()=>no(r.error)})},
  tx(m,fn){return new Promise((ok,no)=>{const t=DB.db.transaction('recs',m),s=t.objectStore('recs');const q=fn(s);t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})},
  put(x){return DB.tx('readwrite',s=>s.put(x))},del(id){return DB.tx('readwrite',s=>s.delete(id))},all(){return DB.tx('readonly',s=>s.getAll())}};
let RECS=[];const URLS=new Map();const urlOf=b=>{if(!URLS.has(b))URLS.set(b,URL.createObjectURL(b));return URLS.get(b)};
async function loadRecs(){try{RECS=(await DB.all()).sort((a,b)=>b.at-a.at)}catch(e){RECS=[]}}

/* ---------- mantar çizimleri ---------- */
function mush(o){
  const cap=o.cap||'#c98b5a',gill=o.gill||'#f4ead8',stem=o.stem||'#f2ead9',ink='#3b3128';let s='';
  s+=`<rect x="0" y="0" width="160" height="170" fill="none"/>`;
  s+=`<path d="M8 150 Q80 142 152 150 L152 170 L8 170Z" fill="#c9b48f" opacity=".55"/>`;
  if(o.cluster){return `<svg viewBox="0 0 160 170" aria-hidden="true">${s}<path d="M20 152 Q60 120 100 152Z" fill="#8a6a45"/>${[30,62,94,120].map((x,i)=>{const h=[70,92,80,60][i],y=150-h;return `<path d="M${x+6} 150 L${x+10} ${y+14} L${x+16} ${y+14} L${x+20} 150Z" fill="${stem}" stroke="${ink}" stroke-width="1.5"/><path d="M${x-8} ${y+16} Q${x+13} ${y-14} ${x+34} ${y+16} Q${x+13} ${y+8} ${x-8} ${y+16}Z" fill="${cap}" stroke="${ink}" stroke-width="1.5"/>`}).join('')}</svg>`}
  if(o.shape==='morel'||o.shape==='brain'){
    let t=`<path d="M70 150 L72 104 L88 104 L90 150Z" fill="${stem}" stroke="${ink}" stroke-width="2"/>`;
    if(o.shape==='morel'){t+=`<path d="M56 108 Q50 50 80 22 Q110 50 104 108Z" fill="${cap}" stroke="${ink}" stroke-width="2"/>`;
      for(let r=0;r<5;r++)for(let c=0;c<4;c++){const x=62+c*11+(r%2)*5,y=40+r*14;t+=`<ellipse cx="${x}" cy="${y}" rx="4" ry="5.5" fill="#5b4330" opacity=".75"/>`}}
    else{t+=`<path d="M50 108 Q42 60 66 42 Q80 30 96 42 Q120 58 110 108Z" fill="${cap}" stroke="${ink}" stroke-width="2"/>`;
      t+=`<path d="M58 96 Q66 82 60 70 Q70 58 64 50 M78 100 Q86 86 78 74 Q90 64 82 48 M98 98 Q92 84 100 72 Q92 60 100 52" fill="none" stroke="#5b2a1a" stroke-width="3" stroke-linecap="round"/>`}
    return `<svg viewBox="0 0 160 170" aria-hidden="true">${s}${t}</svg>`}
  const big=o.small?0.7:1,cy=o.shape==='umbrella'?64:o.shape==='egg'?96:74;
  let t='';
  const stemTop=cy+6,sx=80,sw=o.small?10:16;
  t+=`<path d="M${sx-sw/2} 150 L${sx-sw/2+2} ${stemTop} L${sx+sw/2-2} ${stemTop} L${sx+sw/2} 150Z" fill="${stem}" stroke="${ink}" stroke-width="2"/>`;
  if(o.snake)for(let y=stemTop+10;y<146;y+=10)t+=`<path d="M${sx-sw/2+2} ${y} l${sw/2-2} 4 l${sw/2-2} -4" fill="none" stroke="#9b7a55" stroke-width="1.5"/>`;
  if(o.volva)t+=`<path d="M${sx-sw/2-10} 152 Q${sx-sw/2-14} 128 ${sx-sw/2} 126 L${sx+sw/2} 126 Q${sx+sw/2+14} 128 ${sx+sw/2+10} 152Z" fill="#fbf7ef" stroke="${ink}" stroke-width="2"/><path d="M${sx-sw/2-8} 134 q4 -4 8 0 M${sx+sw/2} 132 q4 -4 8 0" stroke="${ink}" stroke-width="1.5" fill="none"/>`;
  if(o.bulb)t+=`<ellipse cx="${sx}" cy="146" rx="${sw}" ry="9" fill="${stem}" stroke="${ink}" stroke-width="2"/>`;
  if(o.ring)t+=`<path d="M${sx-sw/2-8} ${stemTop+22} Q${sx} ${stemTop+12} ${sx+sw/2+8} ${stemTop+22} Q${sx} ${stemTop+30} ${sx-sw/2-8} ${stemTop+22}Z" fill="#fbf7ef" stroke="${ink}" stroke-width="1.8"/>`;
  const w=(o.shape==='umbrella'?62:54)*big,top=o.shape==='umbrella'?cy-26*big:o.shape==='funnel'?cy-6:cy-40*big;
  if(o.shape==='egg'){t=`<path d="M58 150 Q50 110 80 92 Q110 110 102 150Z" fill="#fbf7ef" stroke="${ink}" stroke-width="2"/><path d="M68 108 Q80 96 92 108 Q80 104 68 108Z" fill="${cap}"/>`}
  else if(o.shape==='funnel'){t+=`<path d="M${sx-sw/2} ${cy+10} L${sx-w+8} ${cy-14} L${sx+w-8} ${cy-14} L${sx+sw/2} ${cy+10}Z" fill="${gill}" stroke="${ink}" stroke-width="1.5"/>`;for(let i=-3;i<=3;i++)t+=`<line x1="${sx+i*sw/8}" y1="${cy+9}" x2="${sx+i*(w-10)/3}" y2="${cy-13}" stroke="${ink}" stroke-width=".8" opacity=".5"/>`;
    t+=`<path d="M${sx-w} ${cy-30} Q${sx} ${cy-6} ${sx+w} ${cy-30} Q${sx+w+2} ${cy-18} ${sx+w-8} ${cy-14} Q${sx} ${cy-2} ${sx-w+8} ${cy-14} Q${sx-w-2} ${cy-18} ${sx-w} ${cy-30}Z" fill="${cap}" stroke="${ink}" stroke-width="2"/><ellipse cx="${sx}" cy="${cy-24}" rx="${w*.55}" ry="5" fill="${ink}" opacity=".12"/>`}
  else{t+=`<path d="M${sx-w} ${cy} Q${sx-w} ${top} ${sx} ${top} Q${sx+w} ${top} ${sx+w} ${cy}Z" fill="${cap}" stroke="${ink}" stroke-width="2"/>`;
    t+=`<path d="M${sx-w+3} ${cy+1} L${sx+w-3} ${cy+1} L${sx+sw/2} ${cy+8} L${sx-sw/2} ${cy+8}Z" fill="${gill}" stroke="${ink}" stroke-width="1.5"/>`;
    for(let i=-4;i<=4;i++)t+=`<line x1="${sx+i*w/5}" y1="${cy+1.5}" x2="${sx+i*sw/10}" y2="${cy+7.5}" stroke="${ink}" stroke-width=".8" opacity=".5"/>`;
    if(o.warts)[[-28,-14],[-8,-26],[14,-20],[30,-8],[-36,-4],[2,-10],[20,-32]].forEach(([dx,dy])=>{if(top<cy+dy*big)t+=`<circle cx="${sx+dx*big}" cy="${cy+dy*big}" r="${4*big}" fill="#fffaf0" stroke="${ink}" stroke-width=".8"/>`});
    if(o.scales)for(let i=0;i<14;i++){const a=i/14*Math.PI,r=w*.75,x=sx-Math.cos(a)*r*.9,y=cy-Math.sin(a)*(cy-top)*.7;t+=`<path d="M${x-4} ${y} l4 -4 l4 4" fill="none" stroke="#6b4a2c" stroke-width="2"/>`}
    if(o.umbo)t+=`<ellipse cx="${sx}" cy="${top+5}" rx="9" ry="5" fill="#7a5638"/>`}
  if(o.milk)t+=`<circle cx="${sx+w-10}" cy="${cy+12}" r="5" fill="${o.milk}" stroke="${ink}" stroke-width="1"/><path d="M${sx+w-10} ${cy+17} q0 8 -3 12" stroke="${o.milk}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 160 170" aria-hidden="true">${s}${t}</svg>`}

/* ---------- içerik ---------- */
const QS=[
 {k:'volva',q:'Sapın en dibinde, toprağın içinde <b>kese, torba ya da yumru</b> gibi bir şişkinlik var mı?',h:'Mantarı bıçakla kesmeyin; toprağı kazıyıp bütün olarak çıkarın. Kesip topladıysanız bakamazsınız, o zaman “Emin değilim” deyin.',why:'Sapın dibindeki kese, Türkiye’deki ölümlerin çoğuna yol açan köygöçüren ve panter mantarında görülür.'},

const plain=h=>String(h).replace(/<[^>]+>/g,'').replace(/&[a-z]+;/g,' ');
function speak(t){try{const ss=window.speechSynthesis;if(!ss){toast('Bu telefonda sesli okuma yok');return}ss.cancel();const u=new SpeechSynthesisUtterance(plain(t));u.lang='tr-TR';u.rate=.92;const v=ss.getVoices().find(v=>/^tr/i.test(v.lang));if(v)u.voice=v;ss.speak(u)}catch(e){toast('Sesli okuma açılamadı')}}

function here(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no({ui:'Bu telefon konum veremiyor.'});
  navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0),at:Date.now()}),
   e=>no({ui:e&&e.code===1?'Konum izni verilmedi. Telefonun ayarlarından bu uygulamaya konum izni verin.':'Konum bulunamadı. Açık havada birkaç saniye bekleyip tekrar deneyin.'}),{enableHighAccuracy:true,timeout:20000,maximumAge:5000})})}
const R=6371000,rad=x=>x*Math.PI/180;
function dist(a,b){const dl=rad(b.lat-a.lat),dn=rad(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function bearing(a,b){const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat)),x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));return (Math.atan2(y,x)*180/Math.PI+360)%360}
const DIRS=['kuzey','kuzeydoğu','doğu','güneydoğu','güney','güneybatı','batı','kuzeybatı'];
const dirOf=b=>DIRS[Math.round(b/45)%8];const cap1=t=>t.charAt(0).toLocaleUpperCase('tr-TR')+t.slice(1);
const mfmt=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toLocaleString('tr-TR',{maximumFractionDigits:1})+' km';
const mapsUrl=p=>`https://www.google.com/maps/search/?api=1&query=${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;

   ${S.sub==='spots'?vSpots():vRecs()}`}
function vSpots(){const me=S.me;
  const L=SPOTS.map(s=>({s,d:me?dist(me,s):null,b:me?bearing(me,s):null})).sort((a,b)=>(a.d??1e12)-(b.d??1e12)||(b.s.at-a.s.at));
  return `<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3>Neredeyim?</h3>${speakBtn('Buradayım düğmesine basınca telefon yerinizi bulur. Ocaklarınızın ne kadar uzakta ve hangi yönde olduğunu gösterir. Bunun için internet gerekmez.')}</div>
    <p class="muted">Ocaklarınızın uzaklığını ve yönünü gösterir. İnternet gerekmez, telefonun konumu yeter.</p>
    <button class="btn pri wide" type="button" data-act="locate">📡 ${me?'Yerimi yenile':'Buradayım, yerimi bul'}</button>
    ${me?`<span class="muted" style="font-size:15px">Konum ${new Date(me.at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})} · ±${me.acc} m</span>`:''}
    <button class="btn wide" type="button" data-act="addspot">➕ Burası bir ocak, kaydet</button></div>
   ${me&&SPOTS.length?radar(L):''}
   ${L.length?L.map(({s,d,b})=>`<button type="button" class="card spot" data-spot="${s.id}"><div class="row" style="justify-content:space-between;align-items:center;flex-wrap:nowrap"><b>📍 ${esc(s.name)}</b>${d!=null?`<span class="dist">${mfmt(d)}</span>`:''}</div>
     ${d!=null?`<span class="dirw">${d<40?'Tam buradasınız':cap1(dirOf(b))+' yönünde'}</span>`:''}<span class="muted" style="font-size:15px">${s.kind?esc(s.kind)+' · ':''}${(s.visits||[]).length?'son gidiş '+new Date(s.visits[s.visits.length-1]).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}):'kaydedildi '+new Date(s.at).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</span></button>`).join('')
   :'<p class="empty">Henüz ocak yok.<br>Mantar topladığınız yerde “Burası bir ocak, kaydet” düğmesine basın. Seneye aynı yeri kolayca bulursunuz.</p>'}`}
function radar(L){const W=300,C=W/2,maxD=Math.max(...L.map(x=>x.d));const steps=[100,200,500,1000,2000,5000,10000,20000,50000];const range=steps.find(s=>s>=maxD*1.1)||maxD*1.1;const k=(C-26)/range,rot=S.compass&&S.heading!=null?-S.heading:0;
  return `<div class="card radar"><div class="row" style="justify-content:space-between;align-items:center"><h3>Etrafım</h3><button class="chip" type="button" data-act="compass" aria-pressed="${S.compass}">🧭 Pusula ${S.compass?'açık':'kapalı'}</button></div>
   <svg viewBox="0 0 ${W} ${W}" role="img" aria-label="Ocakların haritası">
    <circle cx="${C}" cy="${C}" r="${C-6}" fill="#eef3ea" stroke="#c9d8c2"/><circle cx="${C}" cy="${C}" r="${(C-26)/2}" fill="none" stroke="#c9d8c2" stroke-dasharray="4 5"/>
    <g transform="rotate(${rot} ${C} ${C})"><text x="${C}" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#b3261e">K</text>
    ${L.map(({s,d,b},i)=>{const x=C+Math.sin(rad(b))*d*k,y=C-Math.cos(rad(b))*d*k;return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="9" fill="#3f6b4a" stroke="#fff" stroke-width="2"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" transform="rotate(${-rot})">${i+1}</text></g>`}).join('')}</g>
    <circle cx="${C}" cy="${C}" r="8" fill="#2b6fd6" stroke="#fff" stroke-width="3"/>${S.compass?`<path d="M${C} ${C-24} l-7 12 h14z" fill="#2b6fd6"/>`:''}
   </svg><span class="muted" style="font-size:15px">Mavi nokta sizsiniz. Kesikli halka ${mfmt(range/2)}, dış halka ${mfmt(range)}. ${S.compass?'Telefonu düz tutun; harita baktığınız yöne döner.':'Yukarısı kuzey.'}</span>
   <ol class="legend">${L.map(({s,d})=>`<li>${esc(s.name)} · ${mfmt(d)}</li>`).join('')}</ol></div>`}

async function shrink(file){const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(b=>ok(b||file),'image/jpeg',.85))}catch(e){return file}finally{URL.revokeObjectURL(url)}}
function grabDraft(){const d=S.draft;if(!d)return;const n=$('note'),a=$('amount');if(n)d.note=n.value.trim();if(a)d.amount=a.value.trim()}
async function saveDraft(){const d=S.draft;if(!d)return null;grabDraft();const ex=RECS.find(r=>r.id===d.id);const rec=Object.assign(ex||{},d);
  try{await DB.put(rec)}catch(e){toast('Kaydedilemedi: telefonda yer kalmamış olabilir');return null}if(!ex)RECS.unshift(rec);
  if(rec.spot){const sp=SPOTS.find(s=>s.id===rec.spot);if(sp){const day=new Date(rec.at).toDateString();sp.visits=sp.visits||[];if(!sp.visits.some(v=>new Date(v).toDateString()===day)){sp.visits.push(rec.at);saveSpots()}}}
  return rec}
const fileOf=(b,t)=>new File([b],`mantar-${t.toLowerCase().replace(/[^a-zçğıöşü]/g,'')}.jpg`,{type:'image/jpeg'});
async function share(r){const files=SHOTS.filter(([k])=>r.imgs[k]).map(([k,t])=>fileOf(r.imgs[k],t)),sp=r.spot&&SPOTS.find(s=>s.id===r.spot);
  const text=`${ASK}, bu mantara bakar mısın? 🍄\n${r.place?'Yer: '+r.place+'\n':''}${sp?'Ocak: '+sp.name+'\n':''}${r.amount?'Miktar: '+r.amount+'\n':''}${r.note?'Not: '+r.note+'\n':''}${r.loc?'Konum: '+mapsUrl(r.loc)+'\n':''}${r.verdict==='red'?'Kontrol listesi: YEMEYİN dedi.\n':r.verdict==='amber'?'Kontrol listesi: şüpheli işaret bulmadı, uzmana göster dedi.\n':''}(Mantar Bekçisi)`;
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{if(navigator.share){await navigator.share({text});toast('Fotoğrafları ayrıca galeriden ekleyin');return}}catch(e){if(e&&e.name==='AbortError')return}
  toast('Bu telefonda paylaşma açılamadı. Fotoğrafları galeriden gönderin.',4000)}
const AIQ=r=>`Bu fotoğraflardaki mantarı Antalya Kaş’ta topladık${r.place?' ('+r.place+')':''}. Fotoğraflar: üstü, altı, sapın dibi ve kesiti.
Lütfen bize “yenir” ya da “güvenli” DEME; fotoğraftan bunu kimse kesin bilemez.
Bunun yerine:
1) Bu mantarda zehirli olma ihtimalini gösteren işaretler var mı? (sapın dibinde kese/yumru, beyaz lameller, etek, şapkada beyaz benekler, yeşilimsi şapka, odunda öbek halinde çıkma, beyaz süt vb.)
2) Bu mantar hangi zehirli mantarlarla karıştırılabilir, onları nasıl ayırırız?
3) Fotoğraflarda neyi göremiyorsun, uzmana neyi göstermeliyiz?
Kısa ve sade Türkçe yaz, büyüklerimiz okuyacak.${r.note?'\nNotumuz: '+r.note:''}`;
async function askAI(r){const files=SHOTS.filter(([k])=>r.imgs[k]).map(([k,t])=>fileOf(r.imgs[k],t)),text=AIQ(r);
  const cp=navigator.clipboard?navigator.clipboard.writeText(text).catch(()=>{}):Promise.resolve();
  try{if(navigator.canShare&&navigator.canShare({files,text})){await navigator.share({files,text});toast('Uygulamada soruyu gönderin. Soru panoya da kopyalandı.',4000);return}}catch(e){if(e&&e.name==='AbortError')return}
  await cp;toast('Soru panoya kopyalandı. ChatGPT ya da Gemini’yi açıp fotoğrafları ekleyin, yapıştırın.',5000)}
function nearestSpot(p){let best=null;for(const s of SPOTS){const d=dist(p,s);if(d<=150&&(!best||d<best.d))best={s,d}}return best&&best.s}
function newSpot(p,name){const n=SPOTS.length+1,sp={id:'s'+Date.now().toString(36),name:name||('Ocak '+n),lat:p.lat,lng:p.lng,acc:p.acc,at:Date.now(),visits:[Date.now()],kind:''};SPOTS.push(sp);saveSpots();return sp}

/* ---------- pusula ---------- */
let compassOn=false;function onOri(e){let h=null;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(e.absolute&&e.alpha!=null)h=360-e.alpha;if(h==null)return;
  const prev=S.heading;S.heading=h;if(S.view==='book'&&!S.spot&&!S.rec&&!S.draft&&(prev==null||Math.abs(((h-prev+540)%360)-180)>4)){const sv=document.querySelector('.radar svg g');if(sv){const C=150;sv.setAttribute('transform',`rotate(${-h} ${C} ${C})`);sv.querySelectorAll('text').forEach((t,i)=>{if(i>0)t.setAttribute('transform',`rotate(${h})`)})}}}
function setCompass(on){S.compass=on;if(on&&!compassOn){compassOn=true;window.addEventListener('deviceorientationabsolute',onOri,true);window.addEventListener('deviceorientation',onOri,true);
    setTimeout(()=>{if(S.compass&&S.heading==null)toast('Bu telefonda pusula bulunamadı. Harita yukarısı kuzey olarak kalır.',4000)},2500)}render()}

/* ---------- olaylar ---------- */
document.addEventListener('click',async e=>{
  const sy=e.target.closest('[data-say]');if(sy){speak(SAY[+sy.dataset.say]||'');return}
  const g=e.target.closest('[data-go2]');if(g){const v=g.dataset.go2;if(v==='check')resetCheck();if(v==='book'){S.rec=null;S.draft=null;S.spot=null;if(g.dataset.sub)S.sub=g.dataset.sub}go(v);return}
  const sb=e.target.closest('.seg [data-sub]');if(sb){S.sub=sb.dataset.sub;render();return}
  const pl=e.target.closest('[data-place]');if(pl&&S.draft){grabDraft();S.draft.place=S.draft.place===pl.dataset.place?'':pl.dataset.place;render();return}
  const sk=e.target.closest('[data-spkind]');if(sk){const sp=SPOTS.find(x=>x.id===S.spot);if(sp){sp.name=($('spName')||{}).value||sp.name;sp.note=($('spNote')||{}).value||'';sp.kind=sp.kind===sk.dataset.spkind?'':sk.dataset.spkind;saveSpots();render()}return}
  const rc=e.target.closest('[data-rec]');if(rc){S.rec=rc.dataset.rec;S.view='book';render();window.scrollTo({top:0});return}
  const spb=e.target.closest('[data-spot]');if(spb){S.spot=spb.dataset.spot;S.rec=null;S.view='book';render();window.scrollTo({top:0});return}
  const an=e.target.closest('[data-ans]');if(an){const q=QS[S.qi],v=an.dataset.ans;S.answers[q.k]=v;
    if(v!=='no'){S.result={v:'red',why:v==='unsure'?'Emin olmadığınız bir işaret var. Emin değilseniz yemeyin. '+q.why:q.why};await finishCheck();render();window.scrollTo({top:0});return}
    if(S.qi<QS.length-1){S.qi++;render();window.scrollTo({top:0});return}
    S.result={v:'amber'};await finishCheck();render();window.scrollTo({top:0});return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='zoom'){ZOOM=ZOOM>1?1:1.25;store('zoom',ZOOM);applyZoom();render();return}
  if(a==='intronext'){if(S.introI<INTRO.length-1){S.introI++;render()}else{store('intro',1);S.intro=false;render()}window.speechSynthesis&&speechSynthesis.cancel();return}
  if(a==='introskip'){store('intro',1);S.intro=false;render();return}
  if(a==='introagain'){S.intro=true;S.introI=0;render();window.scrollTo({top:0});return}
  if(a==='qback'){S.qi=Math.max(0,S.qi-1);render();return}
  if(a==='restart'){resetCheck();render();window.scrollTo({top:0});return}
  if(a==='ate'){store('ate',Date.now());toast('Saat kaydedildi');render();return}
  if(a==='ateclear'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Emin misiniz? Tekrar basın';return}store('ate',null);render();return}
  if(a==='newrec'){S.draft={id:'m'+Date.now().toString(36),at:Date.now(),imgs:{},place:'',note:'',amount:''};S.rec=null;S.spot=null;go('book');return}
  if(a==='back'){if(S.draft)grabDraft();S.rec=null;S.draft=null;S.spot=null;S.aiConfirm=null;render();return}
  if(a==='draftloc'){grabDraft();b.disabled=true;b.textContent='Konum aranıyor…';try{const p=await here();S.me=p;S.draft.loc=p;const sp=nearestSpot(p);if(sp){S.draft.spot=sp.id;toast('“'+sp.name+'” ocağına eklendi')}else{const ns=newSpot(p);S.draft.spot=ns.id;toast('Yeni ocak kaydedildi: '+ns.name)}}catch(x){toast(x.ui||'Konum alınamadı',4500)}render();return}
  if(a==='send'){const r=await saveDraft();if(r)await share(r);return}
  if(a==='savedraft'){const r=await saveDraft();if(!r)return;S.draft=null;S.rec=r.id;render();toast('Kaydedildi');return}
  if(a==='savecheck'){const r=await saveDraft();if(!r)return;S.draft=null;resetCheck();S.forRec=r.id;go('check');return}
  if(a==='aidraft'){const r=await saveDraft();if(!r)return;S.draft=null;S.rec=r.id;S.aiConfirm=r.id;render();setTimeout(()=>{const x=$('aiBox');if(x)x.scrollIntoView({block:'center'})},50);return}
  if(a==='ai'){S.aiConfirm=b.dataset.id;render();setTimeout(()=>{const x=$('aiBox');if(x)x.scrollIntoView({block:'center'})},50);return}
  if(a==='aicancel'){S.aiConfirm=null;render();return}
  if(a==='aigo'){const r=RECS.find(x=>x.id===b.dataset.id);S.aiConfirm=null;render();if(r)await askAI(r);return}
  if(a==='sendrec'){const r=RECS.find(x=>x.id===b.dataset.id);if(r)await share(r);return}
  if(a==='checkrec'){resetCheck();S.forRec=b.dataset.id;S.rec=null;go('check');return}
  if(a==='okrec'){const r=RECS.find(x=>x.id===b.dataset.id);if(!r)return;r.ok=!r.ok;try{await DB.put(r)}catch(x){}render();return}
  if(a==='delrec'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Emin misiniz? Tekrar basın';return}const id=b.dataset.id;try{await DB.del(id)}catch(x){}RECS=RECS.filter(r=>r.id!==id);S.rec=null;render();toast('Silindi');return}
  if(a==='rec2spot'){const r=RECS.find(x=>x.id===b.dataset.id);if(!r||!r.loc)return;const sp=nearestSpot(r.loc)||newSpot(r.loc);r.spot=sp.id;try{await DB.put(r)}catch(x){}toast('Ocak: '+sp.name);render();return}
  if(a==='locate'){b.disabled=true;b.textContent='Konum aranıyor…';try{S.me=await here()}catch(x){toast(x.ui||'Konum alınamadı',4500)}render();return}
  if(a==='addspot'){b.disabled=true;b.textContent='Konum aranıyor…';try{const p=await here();S.me=p;const near=nearestSpot(p);if(near&&dist(p,near)<40){toast('Burası zaten kayıtlı: '+near.name);S.spot=near.id}else{const sp=newSpot(p);S.spot=sp.id;toast('Ocak kaydedildi. Ona bir ad verin.')}}catch(x){toast(x.ui||'Konum alınamadı',4500)}render();return}
  if(a==='spotsave'){const sp=SPOTS.find(x=>x.id===b.dataset.id);if(!sp)return;sp.name=(($('spName')||{}).value||'').trim()||sp.name;sp.note=(($('spNote')||{}).value||'').trim();saveSpots();toast('Kaydedildi');render();return}
  if(a==='visit'){const sp=SPOTS.find(x=>x.id===b.dataset.id);if(!sp)return;sp.visits=sp.visits||[];const t=new Date().toDateString();if(!sp.visits.some(v=>new Date(v).toDateString()===t))sp.visits.push(Date.now());saveSpots();toast('Bugünkü gidiş eklendi');render();return}
  if(a==='spotdel'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Emin misiniz? Tekrar basın';return}SPOTS=SPOTS.filter(x=>x.id!==b.dataset.id);saveSpots();S.spot=null;render();toast('Ocak silindi');return}
  if(a==='compass'){setCompass(!S.compass);return}
});
async function finishCheck(){if(!S.forRec)return;const r=RECS.find(x=>x.id===S.forRec);if(!r)return;r.verdict=S.result.v;r.reasons=S.result.v==='red'?[S.result.why]:[];try{await DB.put(r)}catch(e){}}
document.addEventListener('change',async e=>{const t=e.target;if(!t.dataset||!t.dataset.shot||!S.draft)return;const f=t.files&&t.files[0];if(!f)return;grabDraft();
  S.draft.imgs[t.dataset.shot]=await shrink(f);render()});
setInterval(()=>{if(!S.intro&&(S.view==='home'||S.view==='sos')){const ae=document.activeElement;if(!ae||!/TEXTAREA|INPUT/.test(ae.tagName))render()}},60000);
window.speechSynthesis&&speechSynthesis.getVoices();

render();
DB.open().then(loadRecs).then(()=>{if(S.view==='book')render()}).catch(()=>{});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
