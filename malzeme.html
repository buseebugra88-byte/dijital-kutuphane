<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><title>Malzemelerim</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7eef0">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Malzemelerim">
<link rel="manifest" href="malzeme.webmanifest"><link rel="icon" href="malzeme-192.png"><link rel="apple-touch-icon" sizes="180x180" href="malzeme-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--desk:#f7eef0;--desk-2:#efe0e7;--surface:#fffafa;--fg:#4a3c48;--muted:#8a7a89;--line:#ead8e0;--accent:#a65d78;--accent-fg:#fff8fa;
 --f-display:"Young Serif",Georgia,serif;--f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--desk:#1d1814;--desk-2:#28211b;--surface:#2a231d;--fg:#efe5d6;--muted:#b2a08a;--line:#43372c;--accent:#e0ad80;--accent-fg:#2a1a10;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--fg);font:400 1rem/1.45 var(--f-ui);min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 50% at 0 0,#fbe6da 0,transparent 70%),radial-gradient(50% 50% at 100% 10%,#ebe4f6 0,transparent 70%),radial-gradient(60% 50% at 0 100%,#dcefe6 0,transparent 70%);opacity:.8}
@media (prefers-color-scheme:dark){body::before{opacity:.08}}
header,.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto}
header{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
header a{color:var(--muted);text-decoration:none;font-size:.85rem}
h1{margin:0;font:400 1.7rem var(--f-display)}
header p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.wrap{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:18px;box-shadow:0 1px 2px rgba(120,80,100,.06);padding:16px;display:flex;flex-direction:column;gap:14px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.tool{display:flex;flex-direction:column;gap:6px;min-width:0}
.chips,.filter{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 11px;font:500 .84rem var(--f-ui);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn{border:0;border-radius:999px;padding:11px 18px;font:600 .95rem var(--f-ui);cursor:pointer;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.hint{color:var(--muted);font-size:.88rem}
.pill{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--desk-2);color:var(--muted);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:#463844;color:#fff;padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:9;max-width:90vw;text-align:center}
.wrap.foot{flex-direction:row;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.mz-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mz-form input,.mz-form select{border:1px solid var(--line);background:var(--desk);color:var(--fg);border-radius:8px;padding:9px 10px;font:inherit;min-width:0}
@media(max-width:560px){.mz-form{grid-template-columns:1fr}}
.mz-sug{display:flex;flex-wrap:wrap;gap:6px}.mz-sug .chip{font-size:.78rem;padding:4px 9px;border-style:dashed}
.mz-grp{display:flex;flex-direction:column;gap:6px}.mz-grp h3{margin:6px 0 2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.mz-it{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:9px 12px;box-shadow:0 1px 2px rgba(120,80,100,.06)}
.mz-it .nm{flex:1;min-width:0;display:flex;flex-direction:column}.mz-it .nm b{font-weight:600;overflow-wrap:anywhere}.mz-it .nm small{color:var(--muted);overflow-wrap:anywhere}
.mz-st{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.mz-st button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 8px;font:500 .74rem var(--f-ui);cursor:pointer}
.mz-st button[aria-pressed="true"]{color:#fff;border-color:transparent}.mz-st .s-var[aria-pressed="true"]{background:#6f8f6a}.mz-st .s-az[aria-pressed="true"]{background:#c08a3e}.mz-st .s-bitti[aria-pressed="true"]{background:#a65d5d}.mz-st .s-al[aria-pressed="true"]{background:var(--accent)}
.mz-x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:2px 6px}
.mz-shop .mz-it label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer}.mz-shop input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
@media(max-width:480px){.mz-it{flex-wrap:wrap}.mz-st{width:100%;justify-content:flex-start;padding-left:28px}}
</style></head><body>
<header><a href="./mektup.html">← Mektuplar</a><h1>Malzemelerim</h1><p>Mühürlerin, mumların, kalemlerin, kâğıt, zarf ve pulların. Azalanlar ve bitenler alışveriş listesine düşer.</p></header>
<main class="wrap" id="app"></main>
<div class="wrap foot"><button class="btn ghost" id="b-exp">💾 Yedek al</button><button class="btn ghost" id="b-imp">📂 Yedekten yükle</button><input type="file" id="f-imp" accept=".json,application/json" hidden></div>
<div class="toast" id="toast" hidden></div>
<script>
const app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c])}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2600)}
const TOMB="muhurlu-silinen-v1";
function mkTomb(id){try{const t=JSON.parse(localStorage.getItem(TOMB)||"[]");if(!t.includes(id)){t.push(id);localStorage.setItem(TOMB,JSON.stringify(t.slice(-2000)))}}catch(e){}}

/* Malzemelerim: gerçek mektup malzemeleri ve alışveriş listesi */
const MZK="muhurlu-malzeme-v1";
const MZCAT={muhur:["🔏","Mühür"],mum:["🕯️","Mum"],kalem:["🖋️","Kalem"],murekkep:["🫙","Mürekkep"],kagit:["📜","Kâğıt"],zarf:["✉️","Zarf"],pul:["📮","Pul"],sus:["🌸","Süs"]};
const MZSUG={muhur:["Baş harf mühür (B)","Kuru çiçek motifli mühür","Değiştirilebilir başlık seti","Mühür sapı (ahşap)"],
 mum:["Granül mum – bordo","Granül mum – koyu yeşil","Granül mum – altın","Granül mum – krem","Eritme kaşığı","Tealight mum","Silikon mühür altlığı"],
 kalem:["Dolma kalem","Kartuş","Konvertör","Daldırma kalem + uç","Kurşun kalem"],
 murekkep:["Sepya mürekkep","Kahverengi mürekkep","Lacivert mürekkep","Siyah mürekkep"],
 kagit:["Krem kâğıt 100 gr","Kraft kâğıt","Dokulu mektup kâğıdı","Çizgi kılavuzu sayfası"],
 zarf:["Kraft zarf","Krem zarf","Uçak postası zarfı","Kartpostal"],
 pul:["PTT anma pulu","Karışık eski pul paketi","Pul albümü"],
 sus:["Washi bant","Kuru çiçek","Çıkartma","Sicim / ip","Etiket"]};
const MZST={var:["Var","s-var"],az:["Azaldı","s-az"],bitti:["Bitti","s-bitti"],al:["Alınacak","s-al"]};
let MZ=(()=>{try{const v=JSON.parse(localStorage.getItem(MZK)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}})();
let mzTab="hepsi",mzCat="mum";
function mzSave(){try{localStorage.setItem(MZK,JSON.stringify(MZ));return true}catch(e){toast("Cihazda yer kalmadı.");return false}}
function mzNeed(x){return x.st==="az"||x.st==="bitti"||x.st==="al"}
function mzCount(){const el=document.getElementById("mzcount");if(!el)return;const n=MZ.filter(mzNeed).length;el.textContent=n?n:"";el.hidden=!n}
function mzItem(x,shop){const c=MZCAT[x.cat]||["•",""];
  if(shop)return `<div class="mz-it"><label><input type="checkbox" data-mzgot="${x.id}"><span>${c[0]}</span><span class="nm"><b>${esc(x.n)}</b>${x.note?`<small>${esc(x.note)}</small>`:""}</span></label><span class="pill">${MZST[x.st][0]}</span></div>`;
  return `<div class="mz-it"><span>${c[0]}</span><span class="nm"><b>${esc(x.n)}</b>${x.note?`<small>${esc(x.note)}</small>`:""}</span>
   <span class="mz-st">${Object.entries(MZST).map(([k,v])=>`<button class="${v[1]}" data-mzst="${x.id}" data-k="${k}" aria-pressed="${x.st===k}">${v[0]}</button>`).join("")}</span>
   <button class="mz-x" data-mzdel="${x.id}" aria-label="${esc(x.n)} sil" title="Sil">×</button></div>`}
function renderMalz(){
  const need=MZ.filter(mzNeed),owned=MZ.filter(x=>!mzNeed(x));
  const groups=list=>Object.keys(MZCAT).map(k=>{const L=list.filter(x=>x.cat===k).sort((a,b)=>a.n.localeCompare(b.n,"tr"));return L.length?`<div class="mz-grp"><h3>${MZCAT[k][0]} ${MZCAT[k][1]}</h3>${L.map(x=>mzItem(x,mzTab==="liste")).join("")}</div>`:""}).join("");
  app.innerHTML=`<div class="wrap" style="gap:16px">
   
   <div class="filter"><button class="chip" data-mztab="hepsi" aria-pressed="${mzTab==="hepsi"}">Hepsi · ${MZ.length}</button><button class="chip" data-mztab="liste" aria-pressed="${mzTab==="liste"}">🛒 Alışveriş listesi · ${need.length}</button></div>
   ${mzTab==="hepsi"?`<form class="card" id="mz-f">
     <div class="tool"><span class="label">Ne ekliyorsun?</span><div class="chips">${Object.entries(MZCAT).map(([k,v])=>`<button type="button" class="chip" data-mzcat="${k}" aria-pressed="${k===mzCat}">${v[0]} ${v[1]}</button>`).join("")}</div></div>
     <div class="mz-sug">${MZSUG[mzCat].map(t=>`<button type="button" class="chip" data-mzsug="${esc(t)}">＋ ${esc(t)}</button>`).join("")}</div>
     <div class="mz-form"><input name="n" required maxlength="50" placeholder="Adı (ör. Granül mum – bordo)" aria-label="Adı"><input name="note" maxlength="80" placeholder="Not: marka, renk, nereden… (isteğe bağlı)" aria-label="Not">
      <select name="st" aria-label="Durum"><option value="var">Elimde var</option><option value="al">Alınacak</option><option value="az">Azaldı</option></select><button class="btn" type="submit">Ekle</button></div>
   </form>`:""}
   ${mzTab==="liste"
     ?(need.length?`<div class="mz-shop" style="display:flex;flex-direction:column;gap:10px">${groups(need)}</div><div class="row"><span class="hint">Aldıklarını işaretle, “Var”a geçsin.</span><button class="btn ghost" id="mz-copy">📋 Listeyi kopyala</button></div>`:`<p class="hint">Alışveriş listen boş. Bir malzemeyi “Azaldı”, “Bitti” ya da “Alınacak” yaparsan buraya gelir.</p>`)
     :(MZ.length?`<div style="display:flex;flex-direction:column;gap:10px">${groups(MZ)}</div>`:`<p class="hint">Henüz malzeme yok. Yukarıdan bir tür seçip öneriye dokunarak ya da kendin yazarak ekleyebilirsin.</p>`)}
  </div>`;
  app.querySelectorAll("[data-mztab]").forEach(b=>b.addEventListener("click",()=>{mzTab=b.dataset.mztab;renderMalz()}));
  app.querySelectorAll("[data-mzcat]").forEach(b=>b.addEventListener("click",()=>{mzCat=b.dataset.mzcat;renderMalz();const n=document.querySelector('#mz-f [name="n"]');n&&n.focus()}));
  app.querySelectorAll("[data-mzsug]").forEach(b=>b.addEventListener("click",()=>{const n=document.querySelector('#mz-f [name="n"]');n.value=b.dataset.mzsug;n.focus()}));
  const f=document.getElementById("mz-f");if(f)f.addEventListener("submit",e=>{e.preventDefault();const d=new FormData(f),n=String(d.get("n")||"").trim();if(!n)return;
    MZ.push({id:"mz"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),cat:mzCat,n,note:String(d.get("note")||"").trim(),st:String(d.get("st")||"var"),upd:Date.now()});
    if(mzSave()){renderMalz();toast("Eklendi.")}});
  app.querySelectorAll("[data-mzst]").forEach(b=>b.addEventListener("click",()=>{const x=MZ.find(y=>y.id===b.dataset.mzst);if(!x)return;x.st=b.dataset.k;x.upd=Date.now();mzSave();renderMalz()}));
  app.querySelectorAll("[data-mzdel]").forEach(b=>b.addEventListener("click",()=>{const x=MZ.find(y=>y.id===b.dataset.mzdel);if(!x||!confirm(`“${x.n}” silinsin mi?`))return;MZ=MZ.filter(y=>y!==x);mkTomb(x.id);mzSave();renderMalz()}));
  app.querySelectorAll("[data-mzgot]").forEach(c=>c.addEventListener("change",()=>{const x=MZ.find(y=>y.id===c.dataset.mzgot);if(!x)return;x.st="var";x.upd=Date.now();mzSave();setTimeout(renderMalz,250);toast(`“${x.n}” alındı.`)}));
  const cp=document.getElementById("mz-copy");if(cp)cp.addEventListener("click",async()=>{const t="Mektup malzemeleri – alınacaklar\n"+Object.keys(MZCAT).map(k=>{const L=need.filter(x=>x.cat===k);return L.length?`\n${MZCAT[k][1]}\n`+L.map(x=>`☐ ${x.n}${x.note?` (${x.note})`:""}`).join("\n"):""}).join("\n");
    try{await navigator.clipboard.writeText(t.trim());toast("Liste kopyalandı. Notlar'a ya da mesaja yapıştırabilirsin.")}catch(e){toast("Kopyalanamadı.")}});
}

/* Yedek: yalnızca malzemeler; Kütüphanem yedeklerini de okur */
document.getElementById("b-exp").addEventListener("click",()=>{const d=new Date(),ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  let tomb=[];try{tomb=JSON.parse(localStorage.getItem(TOMB)||"[]")}catch(e){}
  const blob=new Blob([JSON.stringify({app:"Malzemelerim",version:1,at:d.toISOString(),mektup:{malz:MZ,tomb}})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="malzemelerim-"+ds+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(MZ.length+" malzeme yedeklendi.")});
const fi=document.getElementById("f-imp");document.getElementById("b-imp").addEventListener("click",()=>fi.click());
fi.addEventListener("change",async()=>{const f=fi.files[0];fi.value="";if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){toast("Bu dosya okunamadı.");return}
  const inc=d&&d.mektup&&Array.isArray(d.mektup.malz)?d.mektup:null;if(!inc){toast("Bu dosyada malzeme yedeği yok.");return}
  let tomb=[];try{tomb=JSON.parse(localStorage.getItem(TOMB)||"[]")}catch(e){}tomb=[...new Set([...tomb,...(inc.tomb||[])])].slice(-2000);const T=new Set(tomb);
  const m=new Map();for(const x of MZ)if(x&&x.id&&!T.has(x.id))m.set(x.id,x);for(const x of inc.malz){if(!x||!x.id||T.has(x.id))continue;const o=m.get(x.id);if(!o||(x.upd||0)>(o.upd||0))m.set(x.id,x)}
  const before=MZ.length;MZ=[...m.values()];try{localStorage.setItem(TOMB,JSON.stringify(tomb))}catch(e){}if(mzSave()){renderMalz();const n=MZ.length-before;toast(n>0?n+" malzeme eklendi.":"Yedekteki malzemelerin hepsi zaten burada.")}});
addEventListener("storage",e=>{if(e.key===MZK){try{MZ=JSON.parse(e.newValue||"[]")}catch(x){}renderMalz()}});
renderMalz();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
