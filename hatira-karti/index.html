<!DOCTYPE html>
<html lang="tr" class="app-hatira">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hatıra Kartı">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b10">
<title>DUP Hatıra Kartı – Buse Buğra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --w: min(88vw, 640px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 30% 20%, #1b2236 0%, #0b0b10 55%, #060608 100%);
    color: #c9cbd6;
    font-family: 'Outfit', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 24px; overflow: hidden; min-height: 100vh;
  }
  .glow {
    position: fixed; inset: auto; width: 70vmax; height: 70vmax; border-radius: 50%;
    background: conic-gradient(from 0deg, #45c8ff33, #a74bff33, #ff4d6d2b, #c6ff4d22, #45c8ff33);
    filter: blur(90px); opacity: .55; z-index: 0; animation: spin 24s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .stage { perspective: 1400px; z-index: 1; }
  .tilt {
    width: var(--w); aspect-ratio: 1620 / 1020;
    transform-style: preserve-3d; transition: transform .15s ease-out;
  }
  .card {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .9s cubic-bezier(.2,.8,.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 4.2% / 6.6%;
    overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04);
  }
  .face img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  .back { transform: rotateY(180deg); }

  /* holografik parıltı */
  .shine {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge;
    background: radial-gradient(circle at var(--mx,50%) var(--my,50%),
      rgba(255,255,255,.28) 0%, rgba(160,120,255,.12) 18%, transparent 45%);
    opacity: 0; transition: opacity .3s;
  }
  .stage:hover .shine, .stage.touching .shine { opacity: 1; }

  .controls { display: flex; gap: 10px; z-index: 1; flex-wrap: wrap; justify-content: center; }
  button {
    font: 600 15px 'Outfit', sans-serif; color: #fff; cursor: pointer;
    padding: 11px 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.06); backdrop-filter: blur(8px);
    transition: background .2s, transform .1s;
  }
  button:hover { background: rgba(255,255,255,.12); }
  button:active { transform: scale(.97); }
  button.primary {
    border: none;
    background: linear-gradient(90deg, #45c8ff, #a74bff 50%, #ff4d6d);
  }
  .hint { font-size: 13px; opacity: .55; z-index: 1; letter-spacing: .02em; }

  /* tam ekran görünümü */
  body.full .controls, body.full .hint { opacity: 0; pointer-events: none; }
  body.full { --w: min(96vw, 150vh); }
  .controls, .hint { transition: opacity .3s; }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; } .glow { animation: none; }
  }
</style>
<link rel="stylesheet" href="../ortak/tema.css?v=1">
</head>
<body>
  <div class="glow"></div>

  <div class="stage" id="stage">
    <div class="tilt" id="tilt">
      <div class="card" id="card" role="button" tabindex="0" aria-label="Kartı çevir">
        <div class="face front"><img src="on.png" alt="Dijital Üniversite Platformu katılımcı kartı – Buse Buğra, Yapay Zeka, Modern Yazılım Geliştirme, 2026–2027"><div class="shine"></div></div>
        <div class="face back"><img src="arka.png" alt="Hatıra kartı arka yüzü – 2026–2027 döneminde Dijital Üniversite Platformu'na katılımınızın anısına"><div class="shine"></div></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="flipBtn">↻ Kartı çevir</button>
    <button id="fullBtn">⛶ Tam ekran</button>
  </div>
  <div class="hint">Karta dokun ya da tıkla • İmleci üzerinde gezdir</div>

<script>
  const card = document.getElementById('card');
  const tilt = document.getElementById('tilt');
  const stage = document.getElementById('stage');
  const flip = () => card.classList.toggle('flipped');

  card.addEventListener('click', flip);
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  document.getElementById('flipBtn').addEventListener('click', flip);

  // eğim + parıltı
  function move(x, y) {
    const r = tilt.getBoundingClientRect();
    const px = (x - r.left) / r.width, py = (y - r.top) / r.height;
    const rx = (0.5 - py) * 14, ry = (px - 0.5) * 18;
    tilt.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    const flipped = card.classList.contains('flipped');
    document.querySelectorAll('.shine').forEach(s => {
      s.style.setProperty('--mx', ((flipped ? 1 - px : px) * 100) + '%');
      s.style.setProperty('--my', (py * 100) + '%');
    });
  }
  function reset() { tilt.style.transform = ''; stage.classList.remove('touching'); }
  stage.addEventListener('mousemove', e => move(e.clientX, e.clientY));
  stage.addEventListener('mouseleave', reset);
  stage.addEventListener('touchmove', e => { stage.classList.add('touching'); const t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: true });
  stage.addEventListener('touchend', reset);

  // tam ekran (izin verilmezse sadece sade görünüme geçer)
  document.getElementById('fullBtn').addEventListener('click', async () => {
    document.body.classList.add('full');
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
  });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('full'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('full'); });
  document.body.addEventListener('dblclick', () => document.body.classList.remove('full'));
</script>
</body>
</html>
