<!DOCTYPE html><html lang="tr" class="app-mektup"><head><meta charset=utf8><title>Mühürlü Mektuplar</title>
<meta name="theme-color" content="#f7eef0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mektuplar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=3"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Kalam:wght@400&family=Cormorant+Garamond:ital,wght@1,500&family=Courier+Prime&family=Young+Serif&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --desk:#ecebe6; --surface:#f6f4ee; --fg:#2e2b27; --muted:#8a847a; --line:#dcd8cf;
  --accent:#8c3b3b; --accent-fg:#fff;
  --paper:#efede6; --rule:#cbd2d6;
  --f-display:"Young Serif", Georgia, serif;
  --f-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-type:"Courier Prime", "Courier New", monospace;
  --shadow:0 1px 2px rgba(60,40,20,.10), 0 8px 24px rgba(60,40,20,.14);
  --vvh:100dvh; --vvt:0px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);background-image:var(--noise);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
.h-caveat{font-family:"Caveat","Segoe Print",cursive}
.h-kalam{font-family:"Kalam","Comic Sans MS",cursive}
.h-zarif{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic}
.h-daktilo{font-family:"Courier Prime","Courier New",monospace}
.ov{position:relative}.ov::after{content:"x";position:absolute;left:0;top:0;opacity:.9}
.mk{opacity:0}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2e2b27;color:#f6f4ee;padding:10px 16px;border-radius:999px;font-size:.88rem;z-index:80;max-width:88vw;text-align:center;box-shadow:var(--shadow)}

/* ---------- the typewriter page (Platen style) ---------- */
.pl{position:fixed;left:0;right:0;top:var(--vvt);height:var(--vvh);overflow:hidden;display:flex;flex-direction:column;background:#1b1a19;
  --pp:#efede6;--pfade:rgba(239,237,230,0)}
.pl.gece{--pp:#3a3937;--pfade:rgba(58,57,55,0)}
.pl{transition:background .35s}.pl:not(.open){background:var(--pp)}
.pl.open .sheetp{top:calc(78px + env(safe-area-inset-top));left:6px;right:6px;bottom:-60px;border-radius:50% 50% 0 0/70px 70px 0 0;box-shadow:0 -2px 18px rgba(0,0,0,.35)}
.more{position:absolute;z-index:6;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:#f6f4ee;box-shadow:0 4px 14px rgba(0,0,0,.14);display:grid;place-items:center;cursor:pointer;color:#2e2b27;font:700 22px/1 var(--f-ui);letter-spacing:2px;transition:opacity .2s,transform .2s}
.pl.gece .more{background:#4a4946;color:#ece6da}
.pl.open .more{opacity:0;pointer-events:none;transform:scale(.8)}
.sheetp{position:absolute;left:0;right:0;top:0;bottom:0;transition:top .3s cubic-bezier(.3,.9,.3,1),left .3s,right .3s,border-radius .3s;background:var(--pp);background-image:var(--noise);border-radius:0;overflow:hidden}
.sheetp::before{content:"";position:absolute;left:0;right:0;top:0;height:28%;background:linear-gradient(var(--pp),var(--pfade));z-index:3;pointer-events:none}
.pl.gece .sheetp::after{content:"";position:absolute;left:50%;width:130%;height:70%;top:var(--lampy,30%);transform:translate(-50%,-60%);background:radial-gradient(closest-side,rgba(255,236,196,.3),rgba(255,236,196,.07) 55%,transparent);pointer-events:none;z-index:2;mix-blend-mode:screen}
.pl.gece .ink{text-shadow:0 0 1px currentColor}
.first{position:absolute;z-index:4;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;border:0;background:none;cursor:pointer;font:500 .86rem var(--f-type);color:#8f897e;white-space:nowrap}
.first svg{width:62px;height:62px;opacity:.55}
.pl-top{position:absolute;left:0;right:0;top:0;z-index:5;color:#3a3631;transition:color .3s;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
.ic{width:46px;height:46px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:inherit}
.scr .ic,.tb .ic{color:#3a3631}
.ic svg{width:28px;height:28px}
.ic:active{background:rgba(0,0,0,.05)}
.pl.gece .pl-top,.pl.open .pl-top{color:#d9d4ca}
.ctr{margin-left:auto;margin-right:6px;font:400 .86rem var(--f-type);letter-spacing:.06em;color:#9a948a}
.stage{position:absolute;inset:0;cursor:text}
.col{position:absolute;left:50%;top:0;width:var(--colw,min(56ch,88vw));margin-left:calc(var(--colw,min(56ch,88vw)) / -2);font:600 17px/23px var(--f-type);letter-spacing:.03em;transition:transform .14s ease-out;will-change:transform}
.ink,.col textarea,.meas{white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;font:inherit;letter-spacing:inherit;margin:0;padding:0;border:0}
.ink{position:relative;z-index:1;pointer-events:none;min-height:23px;text-shadow:0 0 .6px currentColor}
.ink span{position:relative}
.col textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;color:transparent;outline:none;overflow:hidden;z-index:2;caret-color:transparent}
.col textarea::selection{background:rgba(140,59,59,.18)}
.meas{position:absolute;visibility:hidden;left:0;top:0;width:100%}
.ph{position:absolute;left:0;top:0;color:#b2aca1;pointer-events:none;z-index:1}
/* roller */
.roller{position:absolute;left:0;right:0;height:48px;z-index:4;pointer-events:none}
.car{pointer-events:auto;cursor:pointer;touch-action:none}
.roller .bar{position:absolute;left:0;right:0;top:12px;height:26px;background:linear-gradient(#5b6066 0,#2f3337 30%,#1b1d20 55%,#3d4247 80%,#26292c 100%);box-shadow:0 4px 8px rgba(0,0,0,.22)}
.roller .bar::after{content:"";position:absolute;left:0;right:0;top:4px;height:3px;background:rgba(255,255,255,.18)}
.roller .cap{position:absolute;top:6px;width:32px;height:38px;border-radius:5px;background:linear-gradient(#3a3e42,#16181a);box-shadow:0 3px 6px rgba(0,0,0,.25)}
.roller .cap.l{left:0;border-radius:0 5px 5px 0}.roller .cap.r{right:0;border-radius:5px 0 0 5px}
.car{position:absolute;top:0;left:0;width:118px;height:56px;border-radius:28px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0) 45%,rgba(0,0,0,.08)),var(--cap,#ece8df);box-shadow:0 6px 12px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.8),inset 0 -3px 6px rgba(0,0,0,.08);display:flex;align-items:center;gap:9px;padding-left:24px;transition:left .12s ease-out;margin-top:-4px}
.car i{width:9px;height:9px;border-radius:50%;background:#3b1f1c}
.car i:first-child{background:#6db46a;box-shadow:0 0 5px rgba(110,180,106,.8)}.car i:last-child{background:#c98c86}
.car .hm{position:absolute;left:var(--hx,59px);top:-44px;width:24px;height:46px;transform:translateX(-50%)}
.car .hm::before{content:"";position:absolute;left:50%;top:0;width:24px;height:7px;margin-left:-12px;border-radius:2px;background:linear-gradient(#9aa0a6,#5d6268)}
.car .hm::after{content:"";position:absolute;left:50%;top:6px;width:6px;height:36px;margin-left:-3px;background:linear-gradient(90deg,#8c9197,#d9dde0,#7c8187)}
.car.hit .hm{animation:hit .09s ease-out}
@keyframes hit{50%{transform:translate(-50%,-5px)}}
/* toolbar */
.tb{position:absolute;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateY(160%);transition:transform .35s cubic-bezier(.3,.9,.3,1);display:flex;align-items:center;gap:2px;background:rgba(246,244,238,.92);border-radius:999px;padding:6px 10px;box-shadow:0 2px 10px rgba(0,0,0,.08),inset 0 0 0 1px rgba(0,0,0,.04);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pl.open .tb{transform:none}
.tb .ic{flex:1;max-width:58px}
.tb .sep{width:1px;height:30px;background:#cfcac0;margin:0 4px}
.tb .go{flex:0 0 auto;border:0;cursor:pointer;background:#2e2b27;color:#f6f4ee;border-radius:999px;padding:10px 16px;font:600 .9rem var(--f-ui);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 0 0 1px rgba(0,0,0,.15)}

/* ---------- bottom sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(30,25,20,.28);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sh{width:min(560px,100%);max-height:82vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.18);animation:up .25s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sh .grab{width:40px;height:5px;border-radius:3px;background:#d4cfc5;margin:0 auto 12px}
.sh h3{margin:0 0 10px;font:400 1.25rem var(--f-display)}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.86rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:#2e2b27;color:#f6f4ee;border-color:#2e2b27}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:.92rem}
.hint{color:var(--muted);font-size:.86rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:0;background:#2e2b27;color:#f6f4ee;border-radius:999px;padding:11px 20px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:transparent;color:#a33a4a;box-shadow:inset 0 0 0 1px #e2c0c4}
.btn:disabled{opacity:.5}
/* kurgu */
.kurgu{display:flex;flex-direction:column;gap:10px}
.ktabs{display:flex;gap:6px;flex-wrap:wrap}
.kurgu p{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.2rem;line-height:1.45}
.kurgu p.hint{font-family:var(--f-ui);font-style:normal;font-size:.88rem}
.kurgu .label{font:600 .72rem var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chlist{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.8rem;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--paper);white-space:nowrap}
.xmini{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 0 0 2px}
.chadd{display:flex;gap:8px;flex-wrap:wrap}
.chadd input{flex:1 1 120px}.fld input{flex:none}.chadd input,.fld input{min-width:0;border:1px solid var(--line);background:var(--paper);color:var(--fg);border-radius:10px;padding:9px 12px;font:inherit}
.kline{font:500 .95rem var(--f-type);color:#5d574e;border-left:2px solid var(--accent);padding-left:10px}

/* ---------- envelope screens ---------- */
.scr{position:fixed;inset:0;overflow:auto;background:var(--paper);background-image:var(--noise)}
.wrap{width:min(680px,100%);margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.hd{display:flex;align-items:center;gap:8px}
.hd h2{margin:0;font:400 1.35rem var(--f-display);flex:1}
.lab{font:600 .72rem var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.fld{display:flex;gap:10px;flex-wrap:wrap}
.fld label{flex:1 1 140px;display:flex;flex-direction:column}
.bench{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.bench{grid-template-columns:1fr}}
.cap{font-size:.75rem;color:var(--muted);margin-top:6px;text-align:center}
.ptiles{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.ptile{width:70px;flex:0 0 auto;border:0;background:none;display:flex;flex-direction:column;gap:5px;align-items:center;font:500 .7rem/1.15 var(--f-ui);color:var(--muted);cursor:pointer;padding:0;text-align:center}
.ptile[aria-pressed="true"]{color:var(--fg);font-weight:600}.ptile[aria-pressed="true"] .esw{outline:2px solid #2e2b27;outline-offset:2px}
.esw{width:62px;height:39px;border-radius:3px;position:relative;display:block;box-shadow:0 1px 3px rgba(0,0,0,.2);overflow:hidden}
.esw.airmail{border:3px solid transparent;border-image:repeating-linear-gradient(-45deg,#b8333a 0 4px,#fbfaf5 4px 6px,#2a4f8a 6px 10px,#fbfaf5 10px 12px) 3}
.esw i{position:absolute;left:0;right:0;top:0;height:60%;filter:brightness(.9) drop-shadow(0 1px 0 rgba(0,0,0,.2))}
.esw b{position:absolute;left:50%;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%)}
.stamps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stamps button{border:0;background:transparent;padding:2px;border-radius:6px;cursor:pointer}
.stamps button[aria-pressed="true"]{box-shadow:0 0 0 2px #2e2b27}
.seals{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seals button{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 -3px 5px rgba(0,0,0,.25)}
.seals button[aria-pressed="true"]{outline:2px solid #2e2b27;outline-offset:3px}
.seals input{width:52px;text-align:center;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px;font:400 1.1rem var(--f-display)}
/* letter box */
.box{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.box button{border:0;background:none;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.box .meta{display:flex;justify-content:space-between;font:.8rem var(--f-type);color:var(--muted);padding:0 2px}
.box .unread .env{box-shadow:var(--shadow),0 0 0 2px rgba(140,59,59,.25)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.lockv{opacity:.75;filter:saturate(.7)}
/* reading */
.read{display:flex;flex-direction:column;gap:18px}
.read .envback{width:min(420px,100%);margin:20px auto 0;transition:margin .7s}
.read .envback.open{margin-top:min(36%,150px)}
.page{background:#f3f1ea;background-image:var(--noise);border-radius:3px;box-shadow:var(--shadow);padding:34px 28px 40px;font:500 17px/32px var(--f-type);white-space:pre-wrap;overflow-wrap:anywhere;animation:fade .6s}
.page .dt{font-size:.85rem;color:#8a847a;text-align:right;margin-bottom:14px}
.page .sg{text-align:right;margin-top:18px;font-family:"Caveat",cursive;font-size:1.6rem}
.page .body span{position:relative}
.page .body{text-shadow:0 0 .5px currentColor}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lockmsg{text-align:center;background:var(--surface);border-radius:16px;padding:18px}

.caps{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;justify-items:center}
.caps button{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 -3px 5px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.1)}
.caps button[aria-pressed="true"]{outline:2px solid #2e2b27;outline-offset:3px}
.sh .sec{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}

.stamp{display:inline-block;padding:5px;background:radial-gradient(circle at 5px 5px, transparent 2.6px, #fbfaf4 3.1px) -5px -5px / 10px 10px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18));line-height:0}
.stamp svg{display:block;width:100%;height:auto}
/* Envelope front */
.env{position:relative;aspect-ratio:1.6/1;max-width:100%;border-radius:4px;box-shadow:var(--shadow);overflow:hidden}
.envfront{padding:8% 7%;color:#2b2b2b}
.envfront.airmail{border:7px solid transparent;border-image:repeating-linear-gradient(-45deg,#b8333a 0 9px,#fbfaf5 9px 15px,#2a4f8a 15px 24px,#fbfaf5 24px 30px) 7}
.envfront .stamp{position:absolute;top:8%;right:6%;width:17%}
.envfront .pm{position:absolute;top:9%;right:19%;width:24%;opacity:.55;pointer-events:none}
.envfront.gold::before{content:"";position:absolute;inset:6px;border:4px double #c9a85a;border-radius:2px;pointer-events:none}
.envfront .from{position:absolute;top:22%;left:7%;max-width:40%;font-size:clamp(.75rem,2.6vw,1rem);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.envfront .air{position:absolute;top:9%;left:7%;font:600 .55rem var(--f-ui);letter-spacing:.14em;color:#2a4f8a}
.envfront .addr{position:absolute;left:14%;right:10%;bottom:16%;display:flex;flex-direction:column;gap:2px}
.envfront .addr .k{font-size:clamp(1rem, 4.4vw, 1.6rem);border-bottom:1px solid rgba(0,0,0,.18);padding-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.envfront .addr .l{border-bottom:1px solid rgba(0,0,0,.18);height:1.3em}

/* Envelope back (flap + seal) */
.envback{position:relative;aspect-ratio:1.6/1;max-width:100%;perspective:900px}
.envback .inside{position:absolute;inset:0;border-radius:4px;box-shadow:var(--shadow)}
.envback .pocket{clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.envback .pocket.bot{clip-path:polygon(0 100%,50% 50%,100% 100%);filter:brightness(.96)}
.envback .folds{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.envback .inside::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.22);border-radius:4px}
.envback .sheet{position:absolute;left:8%;right:8%;top:6%;height:88%;background:var(--paper);border-radius:2px;z-index:2;transform:translateY(0);transition:transform .9s cubic-bezier(.5,0,.2,1);
  background-image:repeating-linear-gradient(to bottom, transparent 0 11px, var(--rule) 11px 12px);background-position:0 14px}
.envback .sheet.out{transform:translateY(-78%)}
.envback .sheet{pointer-events:none}
#pv-back{padding-top:42%}
@media (max-width:560px){#pv-back{padding-top:40%}}
.envback .pocket{position:absolute;inset:0;z-index:3;border-radius:4px}
.envback .flap{position:absolute;left:0;right:0;top:0;height:60%;transform-origin:top center;z-index:4;transition:transform .7s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.envback .flap i{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px 4px 0 0}
.envback .flap .fo{filter:brightness(.93)}
.envback .flap .fl{transform:rotateX(180deg)}
.envback.open .flap{transform:rotateX(180deg);z-index:1}
.envback .seal{position:absolute;left:50%;top:var(--sy,60%);width:22%;transform:translate(-50%,-50%);z-index:5;transition:transform .45s cubic-bezier(.2,1.6,.4,1),opacity .3s}
.wax{position:absolute;left:50%;top:var(--sy,60%);width:24%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:6;pointer-events:none}
.wax svg{width:100%;height:100%;overflow:visible;display:block}
.wax .pud{transform:scale(0);transform-box:fill-box;transform-origin:center}
.stampr{position:absolute;left:50%;top:var(--sy,60%);width:16%;z-index:7;transform:translate(-50%,-190%);opacity:0;transition:transform .35s cubic-bezier(.55,0,.9,.5),opacity .2s;pointer-events:none}
.stampr svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.stampr.down{transform:translate(-50%,-97%);opacity:1}
.stampr.up{transform:translate(-50%,-200%);opacity:0;transition:transform .5s ease-out,opacity .5s}
.cer{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface);border-radius:16px;padding:14px}
.cer p{margin:0}
#cer-drip{touch-action:none;user-select:none;-webkit-user-select:none}
.envback .seal svg{width:100%;height:auto;display:block;overflow:visible}
.envback.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.6)}
.envback .seal.drop{animation:drop .5s cubic-bezier(.2,1.5,.4,1)}

// Each struck letter gets its own ink weight and a hair of baseline drift, like a worn ribbon.
function typeChar(ch,seed,i,ov){
  if(ch==="\n")return ch;if(ch===" "||ch==="\t")return ov?`<span class="ov"> </span>`:ch;
  const h=hashStr(seed+":"+i+ch);const a=(h&255)/255,b=((h>>8)&255)/255,c=((h>>16)&255)/255;
  let op=.68+a*.32; if(c>.93)op=.45; // faint strike now and then
  const dy=((b-.5)*1.3).toFixed(2), dx=c<.06?.6:0;
  return `<span${ov?' class="ov"':""} style="opacity:${op.toFixed(2)};top:${dy}px${dx?";left:"+dx+"px":""}">${esc(ch)}</span>`}
// ~~words~~ are struck over with x's. In the live mirror the markers keep their width (invisible) so the caret stays aligned.
function typePieces(text,seed,mirror){const s=String(text||""),out=[];let ov=false;
  for(let i=0;i<s.length;i++){if(s[i]==="~"&&s[i+1]==="~"){out.push(mirror?'<span class="mk">~~</span>':"");ov=!ov;i++;continue}
    if(s[i]==="\n")ov=false;out.push(typeChar(s[i],seed,i,ov))}return out}
function typeHTML(text,seed,mirror){return typePieces(text,seed,mirror).join("")}

/* ---------- Yaz: the typewriter page ---------- */
let placeCaret=null;
function renderYaz(){
  document.body.style.overflow="hidden";
  app.innerHTML=`<div class="pl" id="pl">
   <header class="pl-top"><button class="ic" id="p-box" aria-label="Mektup kutum">${IC.box}</button><span class="ctr" id="ctr"></span><button class="ic" id="p-share" aria-label="Paylaş">${IC.share}</button></header>
   <div class="stage" id="stage"><div class="sheetp" id="sp"><i class="gl"></i><i class="gr"></i><div class="flmark" id="flmark"></div>

     <button class="first" id="first" hidden>İlk satır lazım mı?</button>
     <div class="roller" id="rl"><i class="cap l"></i><div class="bar"></div><i class="cap r"></i><div class="car" id="car"><span class="hm"></span><i></i><i></i><i></i></div></div>
   </div>
   <nav class="tb" aria-label="Araçlar">
     <button class="ic" id="t-kurgu" aria-label="Kurgu">${IC.kurgu}</button>
     <button class="ic" id="t-ink" aria-label="Mürekkep rengi"><span class="dot" style="background:${INKS[draft.ink]}"></span></button>
     <button class="ic" id="t-strike" aria-label="Üstünü çiz">${IC.strike}</button>
     <button class="ic" id="t-set" aria-label="Kapsül, kâğıt ve gece">${IC.lamp}</button>
     <span class="sep"></span>
     <button class="go" id="t-env">${IC.env.replace('<svg','<svg width="18" height="18"')} Zarfla</button>
   </nav><button class="more" id="p-more" aria-label="Araçlar">•••</button></div>`;
  const ta=document.getElementById("ta"),ink=document.getElementById("ink"),meas=document.getElementById("meas"),col=document.getElementById("col"),
        stage=document.getElementById("stage"),car=document.getElementById("car"),rl=document.getElementById("rl"),ph=document.getElementById("ph"),ctr=document.getElementById("ctr"),first=document.getElementById("first"),sp=document.getElementById("sp");
  ta.value=draft.body;
  const paint=()=>{ink.innerHTML=typeHTML(ta.value,draft.seed,true)+(ta.value.endsWith("\n")||!ta.value?" ":"");ph.hidden=!!ta.value;first.hidden=!!ta.value;
    ctr.textContent=ta.value.replace(/~~/g,"").length.toLocaleString("tr-TR")+" / 3.000"};
  placeCaret=()=>{const pos=ta.selectionEnd??ta.value.length;
    meas.textContent=ta.value.slice(0,pos);const m=document.createElement("span");m.textContent="​";meas.appendChild(m);
    const lh=parseFloat(getComputedStyle(col).lineHeight)||23,ty=m.offsetTop,tx=m.offsetLeft;
    const H=stage.clientHeight,rollY=Math.round(H*(H<520?.62:.56));
    rl.style.top=(rollY-4)+"px";first.style.top=Math.max(20,rollY-190)+"px";sp.style.setProperty("--lampy",(rollY-8-(sp.getBoundingClientRect().top-stage.getBoundingClientRect().top))+"px");
    const spTop=sp.getBoundingClientRect().top-stage.getBoundingClientRect().top;col.style.transform=`translateY(${rollY-ty-lh-60-spTop}px)`;
    ta.style.height=Math.max(ink.offsetHeight,lh)+"px";
    const cx=col.getBoundingClientRect().left-stage.getBoundingClientRect().left+tx;
    const cw=car.offsetWidth,sw=stage.clientWidth;const left=Math.min(Math.max(cx-cw/2,-cw/2+30),sw-cw/2-30);
    car.style.left=left+"px";car.style.setProperty("--hx",(cx-left)+"px")};
  applyLook();paint();requestAnimationFrame(placeCaret);
  let t;const cpl=()=>Math.max(10,Math.round(col.clientWidth/10.6));
  ta.addEventListener("input",e=>{const it=e.inputType||"";if(PREF.sound){if(it==="insertLineBreak"||it==="insertParagraph")sndReturn();else if(it.startsWith("insert")){const pos=ta.selectionStart,ls=ta.value.lastIndexOf("\n",pos-1)+1;if(PREF.bell&&(pos-ls)===cpl()-4)sndDing();else sndKey()}else if(it.startsWith("delete"))sndKey(true)}
    draft.body=ta.value;paint();placeCaret();car.classList.remove("hit");void car.offsetWidth;car.classList.add("hit");clearTimeout(t);t=setTimeout(saveDraft,400)});
  ["keyup","click","select","focus"].forEach(e=>ta.addEventListener(e,()=>placeCaret()));
  document.addEventListener("selectionchange",()=>{if(document.activeElement===ta)placeCaret()});
  stage.addEventListener("pointerdown",e=>{const pl=document.getElementById("pl");if(pl.classList.contains("open")){pl.classList.remove("open");let n=0;const f=()=>{placeCaret();if(++n<20)requestAnimationFrame(f)};f()}if(e.target!==ta){e.preventDefault();ta.focus({preventScroll:true});ta.setSelectionRange(ta.value.length,ta.value.length);placeCaret()}});
  document.getElementById("p-box").addEventListener("click",()=>go("kutu"));
  document.getElementById("p-share").addEventListener("click",async()=>{const txt=ta.value.replace(/~~/g,"").trim();if(!txt){toast("Önce birkaç satır yaz.");return}
    try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{await navigator.clipboard.writeText(txt);toast("Yazın kopyalandı.")}catch(e){toast("Kopyalanamadı.")}});
  document.getElementById("t-ink").addEventListener("click",e=>{const ks=Object.keys(INKS);draft.ink=ks[(ks.indexOf(draft.ink)+1)%ks.length];saveDraft();
    applyLook();toast(INKN[draft.ink]+" mürekkep")});
  first.addEventListener("click",openKurgu);
  document.getElementById("t-set").addEventListener("click",openSet);
  document.getElementById("t-strike").addEventListener("click",()=>{let a=ta.selectionStart,z=ta.selectionEnd;const v=ta.value;
    if(a===z){while(a>0&&/\S/.test(v[a-1]))a--;while(z<v.length&&/\S/.test(v[z]))z++}
    if(a===z){toast("Üstünü çizmek istediğin kelimenin üstüne dokun.");return}
    const seg=v.slice(a,z);const w=/^~~.*~~$/.test(seg)?seg.slice(2,-2):"~~"+seg+"~~";
    ta.setRangeText(w,a,z,"end");ta.dispatchEvent(new Event("input"));ta.focus({preventScroll:true})});
  document.getElementById("t-kurgu").addEventListener("click",openKurgu);
  const pl=document.getElementById("pl");
  document.getElementById("p-more").addEventListener("click",e=>{e.stopPropagation();ta.blur();pl.classList.add("open");let n=0;const f=()=>{placeCaret();if(++n<20)requestAnimationFrame(f)};f()});
  let lp=0,lpDone=false;
  car.addEventListener("pointerdown",e=>{e.stopPropagation();e.preventDefault();lpDone=false;clearTimeout(lp);lp=setTimeout(()=>{lpDone=true;PREF.gece=!isNight();lsSet(PREFK,PREF);applyNight();if(navigator.vibrate)navigator.vibrate(15);toast(isNight()?"☾ Gece lambası":"☀︎ Aydınlık")},550)});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>car.addEventListener(ev,()=>{clearTimeout(lp);if(ev==="pointerup"&&!lpDone){ta.focus({preventScroll:true})}}));
  document.getElementById("t-env").addEventListener("click",()=>{if(!ta.value.trim()){toast("Önce birkaç satır yaz, sonra zarfa koyarız.");ta.focus();return}go("zarf")});
  if(matchMedia("(pointer:fine)").matches)ta.focus({preventScroll:true});
}

/* ---------- capsule, paper and night ---------- */
const PREFK="muhurlu-platen-v1";
let PREF=Object.assign({cap:"klasik",gece:"oto"},lsGet(PREFK,{}));
const DARKQ=matchMedia("(prefers-color-scheme: dark)");
function isNight(){return PREF.gece==="oto"?DARKQ.matches:!!PREF.gece}
DARKQ.addEventListener&&DARKQ.addEventListener("change",()=>{if(PREF.gece==="oto"&&view==="yaz")applyNight()});
function applyNight(){const pl=document.getElementById("pl"),col=document.getElementById("col");if(pl)pl.classList.toggle("gece",isNight());if(col)col.style.color=inkNow()}
const CAPS={klasik:"#ece8df",turuncu:"#d9692f",kiremit:"#a65a3f",adacayi:"#98a585",kobalt:"#3d5fae",komur:"#3a3c40",hardal:"#d4a73a",bordo:"#6b2a2f",murdum:"#3e3150",petrol:"#2f5560",gul:"#c98c8f",limon:"#bcc23c"};
const CAPN={klasik:"Klasik",turuncu:"Turuncu",kiremit:"Kiremit",adacayi:"Adaçayı",kobalt:"Kobalt",komur:"Kömür",hardal:"Hardal",bordo:"Bordo",murdum:"Mürdüm",petrol:"Petrol",gul:"Gül",limon:"Limon"};
const NIGHT_INK={lacivert:"#a9bde6",siyah:"#ece6da",bordo:"#e3a4ab",yesil:"#a6d1b5",sepya:"#dcc0a0",kirmizi:"#f08f8f"};
function inkNow(){return isNight()?NIGHT_INK[draft.ink]||"#ece6da":INKS[draft.ink]}

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==="suspended")AC.resume();return AC}
function noise(ctx,dur){const b=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=b;return s}
function sndKey(soft){if(!PREF.sound)return;const ctx=ac();if(!ctx)return;const t=ctx.currentTime;
  const n=noise(ctx,.05),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type="bandpass";f.frequency.value=1800+Math.random()*1400;f.Q.value=.9;
  g.gain.setValueAtTime((soft?.18:.32)*(0.8+Math.random()*.4),t);g.gain.exponentialRampToValueAtTime(.001,t+.045);n.connect(f).connect(g).connect(ctx.destination);n.start(t);n.stop(t+.05);
  const o=ctx.createOscillator(),og=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(60,t+.04);
  og.gain.setValueAtTime(soft?.08:.16,t);og.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(og).connect(ctx.destination);o.start(t);o.stop(t+.06)}
function sndReturn(){if(!PREF.sound)return;const ctx=ac();if(!ctx)return;const t=ctx.currentTime;
  for(let k=0;k<7;k++){const n=noise(ctx,.02),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type="highpass";f.frequency.value=2200;
    const s=t+k*.03;g.gain.setValueAtTime(.12,s);g.gain.exponentialRampToValueAtTime(.001,s+.02);n.connect(f).connect(g).connect(ctx.destination);n.start(s);n.stop(s+.025)}
  const n=noise(ctx,.08),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type="lowpass";f.frequency.value=700;const s=t+.22;
  g.gain.setValueAtTime(.4,s);g.gain.exponentialRampToValueAtTime(.001,s+.08);n.connect(f).connect(g).connect(ctx.destination);n.start(s);n.stop(s+.09)}
function sndDing(){if(!PREF.sound)return;const ctx=ac();if(!ctx)return;const t=ctx.currentTime;
  [[2093,.16],[4186,.05],[6280,.02]].forEach(([fr,v])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=fr;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+1.4);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+1.5)})}

/* ---------- Platen-style settings ---------- */
const PAPERC={krem:["Krem","#efede6"],beyaz:["Beyaz","#f7f6f2"],fildisi:["Fildişi","#f3ecdc"],kraft:["Kraft","#dcc7a4"],gri:["Taş grisi","#e1e0db"],mavi:["Buz mavisi","#e3e9ee"],pembe:["Gül kurusu","#f0e2de"],adacayi:["Adaçayı","#e2e8dc"]};
const STRN={75:"Soluk şerit",100:"Orijinal",125:"Demlenmiş şerit"};
const RAYS={antrasit:["Orijinal antrasit","linear-gradient(#5b6066 0,#2f3337 30%,#1b1d20 55%,#3d4247 80%,#26292c 100%)"],gumus:["Gümüş","linear-gradient(#e6e8ea 0,#b9bec3 30%,#8d9298 55%,#c9cdd1 80%,#9ea3a8 100%)"],pirinc:["Pirinç","linear-gradient(#f1d896 0,#c9a24f 30%,#8a6a24 55%,#d4b066 80%,#9c7a2f 100%)"],gul:["Gül altını","linear-gradient(#f3cfc4 0,#d39a8a 30%,#9c6556 55%,#e0b0a2 80%,#b07868 100%)"]};
const FLOWERS={turuncu:"#e07b45",kirmizi:"#c9383c",sari:"#e8b53a",mavi:"#5b86c9",mor:"#9a74c9",pembe:"#e38da3"};
const GARDENS={yok:"Yok",sarmasik:"Sarmaşık",kir:"Kır çiçekleri"};
const COPK="muhurlu-cop-v1";
PREF=Object.assign({sound:false,bell:true,machine:true,curved:false,garden:"yok",ray:"antrasit",def:{paperC:"krem",ink:"siyah",str:100}},PREF);
if(!draft.paperC)draft.paperC=PREF.def.paperC||"krem";if(!draft.str)draft.str=PREF.def.str||100;
function savePref(){lsSet(PREFK,PREF)}
function flowerSVG(c,size){return `<svg viewBox="-20 -20 40 52" width="${size||24}" height="${(size||24)*1.3}" aria-hidden="true"><path d="M0 6 C1 16 -2 22 1 31" stroke="#5f7d4a" stroke-width="1.6" fill="none"/><path d="M1 20 C6 17 9 18 10 21 C6 23 3 22 1 20Z" fill="#6f8f58"/>${[0,45,90,135,180,225,270,315].map(a=>`<ellipse cx="0" cy="-7.5" rx="3.6" ry="7.5" fill="${c}" transform="rotate(${a})" opacity=".92"/>`).join("")}<circle r="3.6" fill="#5b3a1e"/><circle r="1.6" fill="#8a5a2c"/></svg>`}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function gardenSVG(k){if(k==="sarmasik"){let p="";for(let y=0;y<240;y+=40){p+=`<path d="M18 ${y} C8 ${y+10} 28 ${y+22} 16 ${y+40}" stroke="#55703f" stroke-width="1.6" fill="none"/><path d="M15 ${y+12} C4 ${y+6} 2 ${y+16} 6 ${y+20} C10 ${y+22} 14 ${y+18} 15 ${y+12}Z" fill="#6c8c4e"/><path d="M19 ${y+28} C30 ${y+22} 34 ${y+32} 30 ${y+36} C26 ${y+38} 21 ${y+34} 19 ${y+28}Z" fill="#7d9c5a"/>`}return svgU(`<svg xmlns="http://www.w3.org/2000/svg" width="36" height="240">${p}</svg>`)}
  if(k==="kir"){const r=rng("kir");let p="";const cols=["#e7a3b3","#f2d16b","#ffffff","#b7a4dd","#e98c6a"];for(let i=0;i<9;i++){const y=10+i*26+r()*8,x=8+r()*18,c=cols[i%5];p+=`<path d="M${x} ${y+4} C${x+2} ${y+12} ${x-3} ${y+18} ${x} ${y+24}" stroke="#6c8c4e" stroke-width="1.2" fill="none"/>`+[0,72,144,216,288].map(a=>{const t=a*Math.PI/180;return `<circle cx="${(x+Math.cos(t)*3.2).toFixed(1)}" cy="${(y+Math.sin(t)*3.2).toFixed(1)}" r="2.6" fill="${c}" stroke="rgba(0,0,0,.12)" stroke-width=".4"/>`}).join("")+`<circle cx="${x}" cy="${y}" r="1.6" fill="#d9a53a"/>`}return svgU(`<svg xmlns="http://www.w3.org/2000/svg" width="36" height="240">${p}</svg>`)}
  return ""}
function applyLook(){const pl=document.getElementById("pl");if(!pl)return;const night=isNight();
  const pp=night?"#3a3937":(PAPERC[draft.paperC]||PAPERC.krem)[1];pl.style.setProperty("--pp",pp);pl.style.setProperty("--pfade",hexA(pp,0));
  pl.classList.toggle("gece",night);pl.classList.toggle("curved",!!PREF.curved);pl.classList.toggle("nomach",!PREF.machine);
  pl.style.setProperty("--cap",CAPS[PREF.cap]||CAPS.klasik);pl.style.setProperty("--raybg",(RAYS[PREF.ray]||RAYS.antrasit)[1]);
  pl.dataset.str=draft.str||100;pl.style.setProperty("--colw",{kisa:"min(25ch,78vw)",orta:"min(31ch,84vw)",uzun:"min(56ch,88vw)",tam:"min(80ch,calc(100vw - 36px))"}[PREF.satir||"uzun"]);const g=gardenSVG(PREF.garden);pl.style.setProperty("--garden",g||"none");pl.classList.toggle("garden",!!g);
  const col=document.getElementById("col");if(col)col.style.color=inkNow();
  const fl=document.getElementById("flmark");if(fl)fl.innerHTML=draft.flower&&FLOWERS[draft.flower]?flowerSVG(FLOWERS[draft.flower],30):"";
  const dot=document.querySelector("#t-ink .dot");if(dot)dot.style.background=INKS[draft.ink];
  if(typeof placeCaret==="function")requestAnimationFrame(()=>placeCaret&&placeCaret())}
applyNight=applyLook;

/* trash: deleted letters wait 30 days */
function copGet(){const t=lsGet(COPK,[]);const now=Date.now();const keep=t.filter(x=>now-x.at<30*864e5);if(keep.length!==t.length)lsSet(COPK,keep);return keep}
function toTrash(l){const t=copGet();t.unshift({l,at:Date.now()});lsSet(COPK,t.slice(0,200));letters=letters.filter(x=>x.id!==l.id);saveLetters()}

function openSet(){
  const v=document.createElement("div");v.className="veil";v.innerHTML=`<div class="set" role="dialog" aria-modal="true" aria-label="Ayarlar"><div class="grab"></div><div class="set-hd"><button class="set-bk" id="st-bk" hidden>‹</button><h3 id="st-t">Ayarlar</h3><button class="set-done" id="st-done">Bitti</button></div><div class="set-bd" id="st-bd"></div></div>`;
  document.body.appendChild(v);const bd=v.querySelector("#st-bd"),bk=v.querySelector("#st-bk"),tt=v.querySelector("#st-t");
  const close=()=>{v.remove();applyLook()};v.addEventListener("click",e=>{if(e.target===v)close()});v.querySelector("#st-done").addEventListener("click",close);
  const chk=on=>`<span class="ck">[${on?"<b>x</b>":"&nbsp;"}]</span>`;
  const row=(id,t,sub,right)=>`<button class="srow" data-r="${id}" data-q="${esc((t+" "+(sub||"")).toLocaleLowerCase("tr-TR"))}"><span><b>${t}</b>${sub?`<small>${sub}</small>`:""}</span>${right||'<i class="chev">›</i>'}</button>`;
  const head=(t,sub)=>`<div class="sgrp"><span>${t}</span>${sub?`<small>${sub}</small>`:""}</div>`;
  const pick=(group,obj,cur,sw)=>`<div class="spick">${Object.entries(obj).map(([k,n])=>`<button data-p="${group}" data-k="${k}" aria-pressed="${String(k)===String(cur)}">${sw?sw(k):""}<span>${esc(Array.isArray(n)?n[0]:n)}</span></button>`).join("")}</div>`;
  function main(){bk.hidden=true;tt.textContent="Ayarlar";const pc=(PAPERC[draft.paperC]||PAPERC.krem)[0];
    bd.innerHTML=`<input class="sfind" id="st-find" placeholder="Bir ayar bul…" autocomplete="off">
    ${head("Bu mektup","Yalnızca bu mektup")}
    ${row("kagit","Kâğıt ve mürekkep",`${pc} · ${INKN[draft.ink]} · ${STRN[draft.str]} · ${draft.str}%`)}
    <div class="srow cl" data-q="çiçekli yer imi preslenmiş çiçek"><span><b>Çiçekli yer imi</b><small>Preslenmiş bir çiçek, Kutu'da bu mektubu işaretler</small></span>
      <div class="flw"><button data-fl="" aria-pressed="${!draft.flower}" aria-label="Çiçek yok"><svg viewBox="0 0 40 40" width="40" height="40"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 30 30 10" stroke="currentColor" stroke-width="1.4"/></svg></button>${Object.entries(FLOWERS).map(([k,c])=>`<button data-fl="${k}" aria-pressed="${draft.flower===k}" aria-label="${k} çiçek">${flowerSVG(c,26)}</button>`).join("")}</div></div>
    ${row("ses1","Yazma sesi",PREF.sound?"Açık":"Kapalı",chk(PREF.sound))}

    ${head("Yeni mektuplar","Yeni mektuplar için başlangıç seçimleri")}
    ${row("varsay","Kâğıt ve mürekkep varsayılanları",`${(PAPERC[PREF.def.paperC]||PAPERC.krem)[0]} · ${INKN[PREF.def.ink]} · ${PREF.def.str}%`)}
    ${head("Mektupların")}
    ${row("kutu","Mektup kutum",letters.length+" mektup")}
    ${row("yedek","Yedek","İndir ya da yedekten geri yükle")}
    ${row("cop","Son Silinenler",copGet().length?copGet().length+" mektup · 30 gün saklanır":"Boş")}
    <div class="sfoot">Mühürlü Mektuplar · Dijital Kütüphanem</div>`;
    const f=bd.querySelector("#st-find");f.addEventListener("input",()=>{const q=f.value.trim().toLocaleLowerCase("tr-TR");bd.querySelectorAll("[data-q]").forEach(r=>r.hidden=!!q&&!r.dataset.q.includes(q));bd.querySelectorAll(".sgrp").forEach(g=>g.hidden=!!q)});
    bd.querySelectorAll("[data-fl]").forEach(b=>b.addEventListener("click",()=>{draft.flower=b.dataset.fl;saveDraft();bd.querySelectorAll("[data-fl]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));applyLook()}));
    bd.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.r)))}
  function sub(title,html,bind){bk.hidden=false;tt.textContent=title;bd.innerHTML=html;bd.scrollTop=0;
    bd.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{bind(b.dataset.p,b.dataset.k);bd.querySelectorAll(`[data-p="${b.dataset.p}"]`).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));applyLook()}))}
  bk.addEventListener("click",main);
  const paperSw=k=>`<i class="sw" style="background:${PAPERC[k][1]}"></i>`,inkSw=k=>`<i class="sw r" style="background:${INKS[k]}"></i>`;
  function act(r){const toggle=(k,lab)=>{PREF[k]=!PREF[k];savePref();applyLook();main();toast(lab+(PREF[k]?" açık":" kapalı"))};
    if(r==="kagit")sub("Kâğıt ve mürekkep",`<div class="slab">Kâğıt</div>${pick("paperC",PAPERC,draft.paperC,paperSw)}<div class="slab">Mürekkep</div>${pick("ink",INKN,draft.ink,inkSw)}<div class="slab">Şerit</div>${pick("str",STRN,draft.str)}`,(g,k)=>{draft[g]=g==="str"?+k:k;saveDraft()});
    else if(r==="varsay")sub("Varsayılanlar",`<div class="slab">Kâğıt</div>${pick("paperC",PAPERC,PREF.def.paperC,paperSw)}<div class="slab">Mürekkep</div>${pick("ink",INKN,PREF.def.ink,inkSw)}<div class="slab">Şerit</div>${pick("str",STRN,PREF.def.str)}`,(g,k)=>{PREF.def[g]=g==="str"?+k:k;savePref()});

    else if(r==="duzen")sub("Sayfa düzeni",`<div class="slab">Kâğıt</div>${pick("curved",{0:"Düz kâğıt",1:"Kavisli kâğıt"},PREF.curved?1:0)}<div class="slab">Satır uzunluğu</div>${pick("satir",{kisa:"Kısa",orta:"Orta",uzun:"Uzun",tam:"Sayfa boyu"},PREF.satir||"uzun")}`,(g,k)=>{if(g==="satir")PREF.satir=k;else PREF.curved=k==="1";savePref()});
    else if(r==="ses")sub("Ses ve dokunuş",`<div class="slab">Yazma sesi</div>${pick("sound",{0:"Kapalı",1:"Mekanik daktilo"},PREF.sound?1:0)}<div class="slab">Satır sonu zili</div>${pick("bell",{0:"Kapalı",1:"Yumuşak zil"},PREF.bell?1:0)}`,(g,k)=>{PREF[g]=k==="1";savePref();if(PREF.sound){sndKey()}});
    else if(r==="gece")sub("Gece ışığı",`${pick("gece",{0:"Kapalı · aydınlık",1:"Açık · gece lambası",oto:"Telefona göre"},PREF.gece==="oto"?"oto":PREF.gece?1:0)}`,(g,k)=>{PREF.gece=k==="oto"?"oto":k==="1";savePref()});
    else if(r==="bahce")sub("Bahçe ve süsler",`<div class="slab">Kâğıdın kenarı</div>${pick("garden",GARDENS,PREF.garden)}`,(g,k)=>{PREF.garden=k;savePref()});
    else if(r==="ses1")toggle("sound","Yazma sesi");
    else if(r==="mak")toggle("machine","Makine");
    else if(r==="paylas")shareLetter();
    else if(r==="yeni"){const b=bd.querySelector('[data-r="yeni"] b');if(!draft.body){close();return}if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Emin misin? Tekrar dokun";return}
      Object.assign(draft,{body:"",kurgu:null,to:"",flower:"",paperC:PREF.def.paperC,ink:PREF.def.ink,str:PREF.def.str,seed:"s"+Date.now().toString(36)});saveDraft();close();renderYaz()}
    else if(r==="kutu"){close();go("kutu")}
    else if(r==="yedek"){sub("Yedek",`<button class="srow" id="bk-out"><span><b>Yedeği indir</b><small>${letters.length} mektup, taslağın ve ayarların tek dosyada</small></span><i class="chev">↓</i></button>
      <label class="srow" style="cursor:pointer"><span><b>Yedekten geri yükle</b><small>Hiçbir şey silinmez; eksik mektuplar geri gelir</small></span><i class="chev">↑</i><input type="file" id="bk-in" accept=".json,application/json" hidden></label>`,()=>{});
      bd.querySelector("#bk-out").addEventListener("click",()=>{const data={app:"Mühürlü Mektuplar",v:2,at:new Date().toISOString(),letters,trash:copGet(),draft,pref:PREF};
        const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));a.download="muhurlu-mektuplar-yedek-"+todayStr()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Yedek indirildi.")});
      bd.querySelector("#bk-in").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());const L=Array.isArray(d)?d:(d.letters||(d.mektup&&d.mektup.letters)||[]);let n=0;
        L.forEach(l=>{if(l&&l.id&&!letters.find(x=>x.id===l.id)){letters.push(l);n++}});sortL();saveLetters();toast(n?n+" mektup geri geldi.":"Yedekteki mektupların hepsi zaten kutunda.")}catch(x){toast("Bu dosya açılamadı.")}})}
    else if(r==="cop"){const draw=()=>{const T=copGet();sub("Son Silinenler",T.length?T.map((x,i)=>`<div class="srow"><span><b>${esc(x.l.to||"Kendime")}</b><small>${esc(shortDate(x.l.created))} · ${30-Math.floor((Date.now()-x.at)/864e5)} gün kaldı</small></span><span class="cbt"><button data-rs="${i}">Geri getir</button><button data-pd="${i}">Kalıcı sil</button></span></div>`).join(""):`<p class="sempty">Silinen mektup yok.</p>`,()=>{});
        bd.querySelectorAll("[data-rs]").forEach(b=>b.addEventListener("click",()=>{const T=copGet(),x=T.splice(+b.dataset.rs,1)[0];lsSet(COPK,T);if(x&&!letters.find(y=>y.id===x.l.id)){letters.push(x.l);sortL();saveLetters()}toast("Mektup kutuna geri döndü.");draw()}));
        bd.querySelectorAll("[data-pd]").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Emin misin?";return}const T=copGet(),x=T.splice(+b.dataset.pd,1)[0];lsSet(COPK,T);if(x)mkTomb(x.l.id);draw()}))};draw()}
  }
  main()}
async function shareLetter(){const txt=(draft.body||"").replace(/~~/g,"").trim();if(!txt){toast("Önce birkaç satır yaz.");return}
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain;charset=utf-8"}));a.download="mektup-"+todayStr()+".txt";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Mektubun indirildi.")}

/* ---------- kurgu as a bottom sheet ---------- */
function sheet(html,onClose){const v=document.createElement("div");v.className="veil";v.innerHTML=`<div class="sh" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  const close=()=>{v.remove();onClose&&onClose()};v.addEventListener("click",e=>{if(e.target===v)close()});document.body.appendChild(v);return {el:v,close}}
function openKurgu(){const s=sheet(`<h3>İlk satırın için bir kurgu</h3><div id="kurgu">${kurguHTML()}</div>`);bindKurgu(s.close)}

/* ---------- Zarfla ---------- */
function previewLetter(){return {...draft,hand:"daktilo",created:new Date().toISOString()}}
function renderZarf(){
  document.body.style.overflow="";const l=previewLetter();
  app.innerHTML=`<div class="scr"><div class="wrap">
   <div class="hd"><button class="ic" id="z-back" aria-label="Yazıya dön">${IC.back}</button><h2>Zarfla ve mühürle</h2></div>
   <div class="bench">
     <div><div id="pv-front">${envFront(l)}</div><div class="cap">Ön yüz</div></div>
     <div style="padding-top:30%"><div id="pv-back">${envBack(l,{id:"eb",open:true,sheetOut:true,noSeal:true})}</div><div class="cap">Arka yüz</div></div>
   </div>
   <div class="fld"><label><span class="lab">Kime</span><input id="f-to" value="${esc(draft.to)}" maxlength="40" placeholder="Kendime"></label><label><span class="lab">İmza</span><input id="f-sign" value="${esc(draft.sign)}" maxlength="40" placeholder="Adın"></label></div>
   <div><span class="lab">Zarf</span><div class="ptiles">${Object.entries(ENVS).map(([k,e])=>`<button class="ptile" data-g="env" data-k="${k}" aria-pressed="${k===draft.env}"><span class="esw ex-${k}${e.b==="air"?" airmail":""}"><i class="ex-${k}" style="clip-path:${poly(flapPts(e.fl))}"></i><b style="top:${FLAPY[e.fl]}%;background:${SEALS[draft.seal]||SEALS.bordo}"></b></span><span>${esc(e.n)}</span></button>`).join("")}</div></div>
   <div><span class="lab">Pul</span><div class="stamps">${[...Object.keys(STAMPS),...OZ.stamps.map(x=>"u:"+x.id)].map(k=>`<button data-g="stamp" data-k="${k}" aria-pressed="${k===draft.stamp}" aria-label="${esc((STAMPS[k]||ozStamp(k)||{}).n||"")} pulu">${stampSVG(k)}</button>`).join("")}</div></div>
   <div><span class="lab">Mum mühür</span><div class="seals">${Object.entries(SEALS).map(([k,c])=>`<button data-g="seal" data-k="${k}" aria-pressed="${k===draft.seal}" style="background:${c}" aria-label="${SEALN[k]}"></button>`).join("")}<input id="f-ini" maxlength="1" value="${esc(draft.initial)}" aria-label="Mühürdeki harf"></div></div>
   <div class="row"><span class="hint">Mühürlenen mektup kutuna girer.</span><button class="btn" id="b-seal">Mühürle</button></div>
  </div></div>`;
  document.getElementById("z-back").addEventListener("click",()=>go("yaz"));
  app.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>{draft[b.dataset.g]=b.dataset.k;saveDraft();const y=app.querySelector(".scr").scrollTop;renderZarf();app.querySelector(".scr").scrollTop=y}));
  const upd=()=>{document.getElementById("pv-front").innerHTML=envFront(previewLetter())};
  const to=document.getElementById("f-to"),sg=document.getElementById("f-sign"),ini=document.getElementById("f-ini");
  to.addEventListener("input",()=>{draft.to=to.value;saveDraft();upd()});
  sg.addEventListener("input",()=>{draft.sign=sg.value;const s=sg.value.trim();if(s&&!ini.dataset.touched){draft.initial=s[0].toLocaleUpperCase("tr-TR");ini.value=draft.initial}saveDraft();upd()});
  ini.addEventListener("input",()=>{ini.dataset.touched="1";draft.initial=ini.value.toLocaleUpperCase("tr-TR");saveDraft()});
  document.getElementById("b-seal").addEventListener("click",sealIt);
}
async function sealIt(){
  const btn=document.getElementById("b-seal");btn.disabled=true;
  const eb=document.getElementById("eb"),sheetEl=eb.querySelector(".sheet"),seal=eb.querySelector(".seal");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;const w=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
  seal.innerHTML=sealOf({...draft,initial:draft.initial||" "});
  eb.scrollIntoView({block:"center",behavior:reduce?"auto":"smooth"});
  await w(300);sheetEl.classList.remove("out");await w(950);eb.classList.remove("open");await w(700);
  seal.style.opacity="";seal.classList.add("drop");await w(800);
  const l={id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),kind:"mektup",to:draft.to.trim(),body:draft.body,sign:draft.sign.trim(),
    paper:"beyaz",rule:"duz",ink:draft.ink,hand:"daktilo",twMix:false,env:draft.env,stamp:draft.stamp,seal:draft.seal,seal2:"",sealImg:"",initial:draft.initial||"B",
    openAfter:"",opened:false,seed:draft.seed,flower:draft.flower||"",paperC:draft.paperC||"krem",str:draft.str||100,deco:[],kurgu:draft.kurgu||null,created:new Date().toISOString()};
  letters.push(l);sortL();if(!saveLetters()){letters=letters.filter(x=>x.id!==l.id);btn.disabled=false;return}
  Object.assign(draft,{body:"",to:"",kurgu:null,flower:"",paperC:PREF.def.paperC,ink:PREF.def.ink,str:PREF.def.str,seed:"s"+Date.now().toString(36)});saveDraft();
  toast("Mühürlendi, kutuna kondu.");go("kutu");
}

/* ---------- Kutu ---------- */
function renderKutu(){
  document.body.style.overflow="";
  app.innerHTML=`<div class="scr"><div class="wrap">
   <div class="hd"><button class="ic" id="k-back" aria-label="Yazıya dön">${IC.back}</button><h2>Mektup kutum</h2><button class="btn" id="k-new">Yeni mektup</button></div>
   <a href="../" class="link" style="text-decoration:none;align-self:flex-start">📚 Dijital Kütüphanem'e dön</a>
   ${letters.length?`<div class="box">${letters.map(l=>{const lk=isLocked(l);return `<button data-open="${esc(l.id)}" class="${!l.opened&&!lk?"unread":""}${lk?" lockv":""}" style="position:relative">${envFrontM(l)}${l.flower&&FLOWERS[l.flower]?`<span class="bxfl">${flowerSVG(FLOWERS[l.flower],30)}</span>`:""}
     <span class="meta"><span>${esc(shortDate(l.created))}</span><span>${lk?"🔒 "+esc(shortDate(l.openAfter)):(l.opened?"açıldı":"mühürlü")}</span></span></button>`}).join("")}</div>`
   :`<div class="empty"><p>Kutun şimdilik boş.</p><p class="hint">Yazdığın ve mühürlediğin mektuplar burada durur.</p></div>`}
  </div></div>`;
  document.getElementById("k-back").addEventListener("click",()=>go("yaz"));
  document.getElementById("k-new").addEventListener("click",()=>go("yaz"));
  app.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{reading=b.dataset.open;go("oku")}));

/* ---------- Oku ---------- */
function pageHTML(l){const kg=l.kurgu&&l.kurgu.yer?`<div class="kline">${esc(l.kurgu.yer)}</div>`:"";
  return `<div class="page" style="color:${INKS[l.ink]||INKS.siyah};background-color:${(PAPERC[l.paperC]||PAPERC.krem)[1]}">${l.flower&&FLOWERS[l.flower]?`<span class="pgfl">${flowerSVG(FLOWERS[l.flower],34)}</span>`:""}<div class="dt">${esc(fmtDate(l.created))}</div>${kg?kg+"<br>":""}<div class="body">${typeHTML(l.body,l.seed||l.id)}</div>${l.sign?`<div class="sg">${esc(l.sign)}</div>`:""}</div>`}
function renderOku(){
  const l=letters.find(x=>x.id===reading);if(!l){go("kutu");return}
  const lk=isLocked(l);
  app.innerHTML=`<div class="scr"><div class="wrap read">
   <div class="hd"><button class="ic" id="o-back" aria-label="Kutuya dön">${IC.back}</button><h2>${esc(l.to||"Kendime")}</h2></div>
   ${lk?`${envFrontM(l)}<div class="lockmsg"><b>Bu mektup ${esc(fmtDate(l.openAfter))} tarihinde açılabilir.</b><br><span class="hint">${daysUntil(l.openAfter)} gün kaldı.</span></div>`
   :l.opened?`<div id="out">${pageHTML(l)}</div><div class="acts"><button class="btn ghost" id="o-env">Zarfı göster</button><button class="btn danger" id="o-del">Sil</button></div>`
   :`<div style="position:relative">${envBack(l,{id:"rb"})}<button class="sealbtn" id="o-break" aria-label="Mührü kır"></button></div><p class="hint" id="o-hint" style="text-align:center;margin:0">Açmak için mührüne dokun.</p><div id="out"></div>`}
  </div></div>`;
  document.getElementById("o-back").addEventListener("click",()=>go("kutu"));
  const del=()=>{const b=document.getElementById("o-del");if(!b)return;b.addEventListener("click",()=>{if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Emin misin? Tekrar dokun";return}
    toTrash(l);toast("Son Silinenler'e taşındı; 30 gün içinde geri getirebilirsin.");go("kutu")})};
  del();
  const ev=document.getElementById("o-env");if(ev)ev.addEventListener("click",()=>{ev.replaceWith(Object.assign(document.createElement("div"),{innerHTML:envFrontM(l),style:"width:100%"}))});
  const br=document.getElementById("o-break");
  if(br)br.addEventListener("click",async()=>{br.remove();const oh=document.getElementById("o-hint");if(oh)oh.remove();const rb=document.getElementById("rb"),seal=rb.querySelector(".seal");
    const w=ms=>new Promise(r=>setTimeout(r,ms));seal.classList.add("crack");await w(380);rb.classList.add("open");await w(650);
    rb.querySelector(".sheet").classList.add("out");await w(900);
    l.opened=true;l.upd=Date.now();saveLetters();
    const out=document.getElementById("out");out.innerHTML=pageHTML(l)+`<div class="acts" style="margin-top:16px"><button class="btn danger" id="o-del">Sil</button></div>`;del();
    out.scrollIntoView({behavior:"smooth",block:"start"})});
}

function render(){({yaz:renderYaz,zarf:renderZarf,kutu:renderKutu,oku:renderOku})[view]()}
(function(){try{const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");const im=x.createImageData(180,180);
  for(let i=0;i<im.data.length;i+=4){const v=170+Math.random()*60;im.data[i]=v;im.data[i+1]=v*.97;im.data[i+2]=v*.9;im.data[i+3]=Math.random()<.35?22:0}
  x.putImageData(im,0,0);document.documentElement.style.setProperty("--noise",`url(${c.toDataURL()})`)}catch(e){}})();
fitVV();render();
addEventListener("storage",e=>{if(e.key===LS){letters=lsGet(LS,[]);sortL();if(view==="kutu")render()}});
readLibChars().then(c=>{LIBCH=c});
